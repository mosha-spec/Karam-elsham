لى ورفعناه مكانا عليا، فقد رفعه الله مكانة عالية بصدقه وعلمه، وقيل رفعه إلى السماء الرابعة، ليكون مثالا للعالم العامل الذي يجمع بين العلم النافع والعمل الصالح."},{titleAr:"إرث القلم",textAr:"ترك إدريس إرثا عظيما للبشرية، فالقلم الذي بدأ به صار أساس حضارات، وكل سطر يكتب في سبيل الحق هو امتداد لما بدأه هذا النبي الكريم عليه السلام."}]},{id:3,nameAr:"نوح عليه السلام",titleAr:"شيخ المرسلين",icon:"\uD83D\uDD4A️",color:"#4A6B8A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/04.mp3"],chapters:[{titleAr:"أول رسول إلى أهل الشرك",textAr:"لما عبدت الأصنام ود وسواع ويغوث ويعوق ونسر، بعث الله نوحا أول رسول إلى أهل الأرض بعد الشرك، فلبث في قومه ألف سنة إلا خمسين عاما يدعوهم ليلا ونهارا سرا وجهارا."},{titleAr:"السفينة والمعجزة",textAr:"أمره الله بصنع السفينة في الصحراء، فسخر منه قومه، لكنه كان يبني سفينة النجاة بأمر الله، وحمل فيها من كل زوجين اثنين، ومن آمن معه، وما آمن معه إلا قليل."},{titleAr:"الطوفان العظيم",textAr:"فار التنور وجاء أمر الله، وانهمرت السماء وفجرت الأرض عيونا، والتقى الماء على أمر قد قدر، وأغرق الله الكافرين، ونجى المؤمنين، وكانت نهاية أول حضارة كفرت بالله."},{titleAr:"الابتلاء في الولد",textAr:"نادى نوح ابنه وكان في معزل يا بني اركب معنا، فأبى وقال سآوي إلى جبل يعصمني، فكان من المغرقين، فتعلم نوح أن الولاء لله وليس للنسب إذا فارق التوحيد."}]},{id:4,nameAr:"هود عليه السلام",titleAr:"نبي عاد",icon:"\uD83C\uDFDC️",color:"#8A6A3B",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/05.mp3"],chapters:[{titleAr:"عاد ذات العماد",textAr:"كانت عاد قوما أقوياء، بنوا المصانع والقصور، ونحتوا الجبال، وقالوا من أشد منا قوة، فأرسل الله إليهم هودا أخاهم، يدعوهم إلى عبادة الله وترك عبادة الأصنام والاستكبار في الأرض."},{titleAr:"منطق الإيمان",textAr:"قال هود يا قوم اعبدوا الله ما لكم من إله غيره، وطلب منهم الاستغفار ليزيدهم الله قوة إلى قوتهم، فكذبوه وقالوا إنما أنت مفتر، واتهموه بالسفه والجنون."},{titleAr:"الريح العقيم",textAr:"لما أصرت عاد على الكفر، أرسل الله عليهم ريحا صرصرا عاتية، سبع ليال وثمانية أيام حسوما، فترى القوم فيها صرعى كأنهم أعجاز نخل خاوية، فأهلكتهم الريح التي كانوا يغترون بقوتهم أمامها."},{titleAr:"نجاة المؤمنين",textAr:"نجى الله هودا والذين آمنوا معه برحمة منه، ونجاهم من عذاب غليظ، ليكونوا شاهدا على أن القوة الحقيقية في الإيمان وليست في البنيان ولا في الأجساد."}]},{id:5,nameAr:"صالح عليه السلام",titleAr:"نبي ثمود",icon:"\uD83D\uDC2A",color:"#6B5B3A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/06.mp3"],chapters:[{titleAr:"ثمود أصحاب الحجر",textAr:"ثمود قوم نحتوا من الجبال بيوتا، وكانوا في رفاهية وقوة، فأرسل الله إليهم صالحا يدعوهم إلى التوحيد، فقالوا يا صالح قد كنت فينا مرجوا قبل هذا، أتنهانا أن نعبد ما يعبد آباؤنا."},{titleAr:"معجزة الناقة",textAr:"طلبوا آية، فأخرج الله لهم من الصخرة ناقة عشراء عظيمة، لها شرب يوم ولهم شرب يوم معلوم، فكانت آية مبصرة، وحذرهم صالح أن يمسوها بسوء فيأخذهم عذاب قريب."},{titleAr:"عقر الناقة",textAr:"عتوا عن أمر ربهم وعقروا الناقة، وقالوا يا صالح ائتنا بما تعدنا إن كنت من المرسلين، فقال تمتعوا في داركم ثلاثة أيام ذلك وعد غير مكذوب، وانتظروا العذاب."},{titleAr:"الصيحة",textAr:"جاءتهم الصيحة فأصبحوا في ديارهم جاثمين، كأن لم يغنوا فيها، ونجى الله صالحا والذين آمنوا معه، ليعلم الناس أن النعم إذا لم تشكر، تنقلب نقما تهلك أصحابها."}]},{id:6,nameAr:"إبراهيم عليه السلام",titleAr:"خليل الرحمن",icon:"\uD83D\uDD25",color:"#8C4A2F",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/07.mp3","https://media.islamway.net/lessons/awady/ALanbeYaa/08.mp3","https://media.islamway.net/lessons/awady/ALanbeYaa/09.mp3"],chapters:[{titleAr:"تحطيم الأصنام",textAr:"نشأ إبراهيم في قوم يعبدون الأصنام والكواكب، فأراد أن يريهم بطلان عبادتهم، فحطم أصنامهم إلا كبيرا لهم، فلما رجعوا قالوا من فعل هذا بآلهتنا، فقال بل فعله كبيرهم هذا فاسألوهم إن كانوا ينطقون."},{titleAr:"النار والنجاة",textAr:"أجمع قومه على حرقه، فجمعوا حطبا شهرا، وأوقدوا نارا عظيمة، ووضعوه في المنجنيق، فقال حسبنا الله ونعم الوكيل، فقال الله يا نار كوني بردا وسلاما على إبراهيم، فنجاه الله من النار."},{titleAr:"الهجرة والابتلاء",textAr:"هاجر إبراهيم ومعه لوط وسارة، وابتلي بذبح ابنه إسماعيل، فلما أسلم وتله للجبين، ناديناه أن يا إبراهيم قد صدقت الرؤيا، وفديناه بذبح عظيم، فكان أبا الأنبياء وخليل الرحمن."},{titleAr:"بناء الكعبة",textAr:"أمره الله مع ابنه إسماعيل برفع قواعد البيت الحرام، فكانا يبنيان ويدعوان ربنا تقبل منا إنك أنت السميع العليم، فصار البيت مثابة للناس وأمنا إلى يوم القيامة."}]},{id:7,nameAr:"لوط عليه السلام",titleAr:"نبي المؤتفكات",icon:"\uD83C\uDF2A️",color:"#5A4A6A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/10.mp3"],chapters:[{titleAr:"الفاحشة الكبرى",textAr:"أرسل الله لوطا إلى قوم كانوا يأتون الفاحشة ما سبقهم بها من أحد من العالمين، يأتون الذكران من العالمين ويقطعون السبيل، فدعاهم إلى الطهارة والزواج الحلال وترك هذه الجريمة المنكرة."},{titleAr:"الضيوف الملائكة",textAr:"جاءت الملائكة إلى إبراهيم تبشره، ثم ذهبت إلى لوط في صورة شباب حسان، فخاف عليهم من قومه، وجاءه قومه يهرعون إليه ومن قبل كانوا يعملون السيئات، فعرض عليهم بناته طهرا لهم."},{titleAr:"الخروج ليلا",textAr:"قالت الملائكة يا لوط إنا رسل ربك لن يصلوا إليك، فأسر بأهلك بقطع من الليل ولا يلتفت منكم أحد إلا امرأتك إنها مصيبها ما أصابهم، فخرج لوط والمؤمنون وتركوا القرية الفاسدة."},{titleAr:"قلب القرى",textAr:"جعل الله عاليها سافلها وأمطر عليها حجارة من سجيل منضود، فكانت نهاية قرية اختارت أن تعاند الفطرة، وبقيت عبرة لكل من يأتي بعدهم إلى يوم الدين."}]},{id:8,nameAr:"إسماعيل عليه السلام",titleAr:"الذبيح الصادق",icon:"\uD83D\uDD4B",color:"#2F5A4A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/11.mp3"],chapters:[{titleAr:"الوادي غير ذي زرع",textAr:"ترك إبراهيم هاجر وإسماعيل بواد غير ذي زرع عند بيت الله المحرم، فقالت هاجر أالله أمرك بهذا قال نعم قالت إذن لا يضيعنا، فكان زمزم معجزة خالدة تروي الحجيج إلى اليوم."},{titleAr:"الرؤيا والامتثال",textAr:"رأى إبراهيم في المنام أنه يذبح إسماعيل، فقال يا بني إني أرى في المنام أني أذبحك فانظر ماذا ترى، قال يا أبت افعل ما تؤمر ستجدني إن شاء الله من الصابرين، فكان قمة التسليم."},{titleAr:"بناء البيت",textAr:"شب إسماعيل وتعلم العربية من جرهم، وصار نبيا، وساعد أباه في بناء الكعبة، وكان صادق الوعد، وكان يأمر أهله بالصلاة والزكاة، وكان عند ربه مرضيا."},{titleAr:"أب العرب",textAr:"من نسل إسماعيل جاء العرب المستعربة، ومنهم خاتم الأنبياء محمد صلى الله عليه وسلم، فكان إسماعيل حلقة وصل بين خليل الرحمن وسيد ولد آدم."}]},{id:9,nameAr:"إسحاق عليه السلام",titleAr:"نبي مبارك",icon:"\uD83C\uDF19",color:"#3A4A6A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/11.mp3"],chapters:[{titleAr:"البشارة على كبر",textAr:"بشرت الملائكة إبراهيم وسارة بغلام عليم وهو إسحاق، وكانا قد بلغا من الكبر عتيا، فضحكت سارة تعجبا، فكان إسحاق آية على قدرة الله الذي يهب لمن يشاء ما يشاء."},{titleAr:"النبوة في الشام",textAr:"نبأ الله إسحاق بعد إبراهيم، وكان نبيا في الشام، دعا إلى التوحيد وورث عن أبيه الحلم والعلم، وبارك الله فيه وفي ذريته، فكان أنبياء بني إسرائيل جميعا من نسله."},{titleAr:"بيت النبوة",textAr:"عاش إسحاق في بيت النبوة، يعلم الناس الحكمة، وكان صابرا شاكرا، وامتد به العمر حتى رأى حفيده يوسف، وكان مثالا للنبي الهادئ الذي يربي أجيالا على الإيمان."},{titleAr:"البركة الممتدة",textAr:"قال تعالى وباركنا عليه وعلى إسحاق، فكانت بركته في ذريته الأنبياء، وفي أرض الشام التي بارك الله حولها، فكان نهر خير لا ينقطع."}]},{id:10,nameAr:"يعقوب عليه السلام",titleAr:"إسرائيل",icon:"⭐",color:"#4A5A3A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/12.mp3"],chapters:[{titleAr:"صاحب الأسباط",textAr:"يعقوب هو إسرائيل، وإليه ينسب بنو إسرائيل، رزقه الله اثني عشر ولدا، منهم يوسف وبنيامين ويهوذا، وكان نبيا صابرا، ابتلي بفراق يوسف وبكى حتى ابيضت عيناه من الحزن."},{titleAr:"رحلة إلى حران",textAr:"خرج يعقوب إلى خاله لابان في حران، وتزوج بابنتيه ليا وراحيل، وكون أسرة كبيرة، ثم عاد إلى فلسطين، وصارعه ملك فسمي إسرائيل، أي عبد الله أو صفوة الله."},{titleAr:"الصبر الجميل",textAr:"لما فقد يوسف قال فصبر جميل والله المستعان على ما تصفون، ولم ييأس من روح الله، وظل يدعو ويبكي حتى جمع الله شمله بيوسف بعد سنين طويلة من الفراق."},{titleAr:"الوصية الأخيرة",textAr:"لما حضر يعقوب الموت جمع بنيه وقال ما تعبدون من بعدي، قالوا نعبد إلهك وإله آبائك إبراهيم وإسماعيل وإسحاق إلها واحدا ونحن له مسلمون، فمات على التوحيد."}]},{id:11,nameAr:"يوسف عليه السلام",titleAr:"الصديق",icon:"\uD83D\uDC51",color:"#7A5A2A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/12.mp3","https://media.islamway.net/lessons/awady/ALanbeYaa/13.mp3","https://media.islamway.net/lessons/awady/ALanbeYaa/14.mp3"],chapters:[{titleAr:"الرؤيا العظيمة",textAr:"رأى يوسف أحد عشر كوكبا والشمس والقمر له ساجدين، فقص رؤياه على أبيه، فقال يا بني لا تقصص رؤياك على إخوتك فيكيدوا لك كيدا، فحسدوه وألقوه في الجب."},{titleAr:"من الجب إلى القصر",textAr:"التقطه السيارة وباعوه بثمن بخس في مصر، واشتراه عزيز مصر، وتربى في قصره، وآتاه الله الحكمة والعلم، وابتلاه بفتنة امرأة العزيز، فاستعصم وقال معاذ الله إنه ربي أحسن مثواي."},{titleAr:"السجن والدعوة",textAr:"دخل السجن مظلوما، فدعا إلى التوحيد هناك، وقال يا صاحبي السجن أأرباب متفرقون خير أم الله الواحد القهار، وفسر رؤيا الملك، فخرج من السجن إلى خزائن الأرض."},{titleAr:"العزيز واللقاء",textAr:"صار يوسف عزيز مصر، وجاء إخوته يطلبون الطعام، فعرفهم وهم له منكرون، ثم جمع أبويه وإخوته وقال هذا تأويل رؤياي من قبل قد جعلها ربي حقا، وخرّوا له سجدا."}]},{id:12,nameAr:"شعيب عليه السلام",titleAr:"خطيب الأنبياء",icon:"⚖️",color:"#5A6A4A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/11.mp3"],chapters:[{titleAr:"أصحاب الأيكة",textAr:"أرسل الله شعيبا إلى مدين، كانوا يبخسون المكيال والميزان ويقطعون الطريق، فقال يا قوم أوفوا المكيال والميزان بالقسط ولا تبخسوا الناس أشياءهم ولا تعثوا في الأرض مفسدين."},{titleAr:"الحوار بالحكمة",textAr:"كان شعيب فصيحا بليغا، سمي خطيب الأنبياء، حاور قومه بالحكمة والموعظة، فقالوا يا شعيب أصلاتك تأمرك أن نترك ما يعبد آباؤنا أو أن نفعل في أموالنا ما نشاء."},{titleAr:"التهديد والثبات",textAr:"هددوه بالرجم والإخراج من القرية، فثبت وقال إني أريد الإصلاح ما استطعت وما توفيقي إلا بالله عليه توكلت وإليه أنيب، فكان مثالا للمصلح الذي لا يخاف لومة لائم."},{titleAr:"عذاب الظلة",textAr:"لما كذبوه أخذهم عذاب يوم الظلة، سلط الله عليهم حرا شديدا، ثم سحابة أظلتهم فلما اجتمعوا تحتها أمطرت عليهم نارا فأحرقتهم، فأصبحوا في ديارهم جاثمين."}]},{id:13,nameAr:"أيوب عليه السلام",titleAr:"الصابر",icon:"\uD83E\uDD32",color:"#4A5A5A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/15.mp3"],chapters:[{titleAr:"النعمة والابتلاء",textAr:"كان أيوب نبيا غنيا كثير المال والولد، أنعم الله عليه بنعم عظيمة، ثم ابتلاه فذهب ماله وولده ومرض جسده، فلم يبق منه عضو سليم إلا قلبه ولسانه يذكر الله بهما."},{titleAr:"ثمانية عشر عاما",textAr:"لبث أيوب في البلاء ثماني عشرة سنة، وهو صابر محتسب، ما تذمر ولا شكا، حتى قالت له زوجته ادع الله أن يشفيك، فقال كم لبثنا في الرخاء قالت ثمانين سنة، قال إني أستحي أن أسأله قبل أن يمضي مثلها."},{titleAr:"الدعاء الخاشع",textAr:"لما اشتد به البلاء قال رب إني مسني الضر وأنت أرحم الراحمين، فاستجاب الله له وكشف ما به من ضر، وقال اركض برجلك هذا مغتسل بارد وشراب، فشفاه الله."},{titleAr:"العوض الجميل",textAr:"آتاه الله أهله ومثلهم معهم رحمة من عنده وذكرى للعابدين، فكان أيوب رمزا للصبر الذي لا ينفد، وقدوة لكل مبتلى ينتظر الفرج من الله."}]},{id:14,nameAr:"ذو الكفل عليه السلام",titleAr:"الصابر الشاكر",icon:"\uD83D\uDEE1️",color:"#3A5A5A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/15.mp3"],chapters:[{titleAr:"الكفيل بالعمل",textAr:"ذو الكفل نبي تكفل بعمل صالح وقام به خير قيام، قيل تكفل لقومه أن يكفيهم أمرهم ويقضي بينهم بالعدل، فوفى بعهده، وكان صابرا على القضاء، شاكرا للنعماء."},{titleAr:"قدوة في الصبر",textAr:"ذكره الله مع إسماعيل وإدريس فقال وإسماعيل وإدريس وذا الكفل كل من الصابرين، فكان مثالا للرجل الذي يتحمل المسؤولية ولا يتهرب، ويصبر على أذى الناس."},{titleAr:"الرحمة المهداة",textAr:"أدخله الله في رحمته إنه من الصالحين، فالرحمة لا تنال إلا بعمل صالح وصبر جميل، وذو الكفل جمع بين الأمرين فاستحق أن يذكر في كتاب الله خالدا."},{titleAr:"درس الكفالة",textAr:"يعلمنا ذو الكفل أن التكفل بالحق مسؤولية عظيمة، من قام بها نال المكانة عند الله، ومن نكث فإن الله لا يحب الخائنين، فكان اسمه رمزا للوفاء بالعهد."}]},{id:15,nameAr:"موسى عليه السلام",titleAr:"كليم الله",icon:"\uD83C\uDF0A",color:"#1A4A5A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/17.mp3","https://media.islamway.net/lessons/awady/ALanbeYaa/18.mp3","https://media.islamway.net/lessons/awady/ALanbeYaa/19.mp3","https://media.islamway.net/lessons/awady/ALanbeYaa/20.mp3","https://media.islamway.net/lessons/awady/ALanbeYaa/21.mp3"],chapters:[{titleAr:"الولادة في زمن الذبح",textAr:"ولد موسى في زمن فرعون الذي كان يذبح أبناء بني إسرائيل، فأوحى الله إلى أمه أن أرضعيه فإذا خفت عليه فألقيه في اليم، فألقته في صندوق وألقته في النيل، فالتقطه آل فرعون."},{titleAr:"التربية في القصر",textAr:"تربى موسى في قصر فرعون، ورده الله إلى أمه كي تقر عينها ولا تحزن، ولتعلم أن وعد الله حق، وشب موسى قويا أمينا، فقتل رجلا من آل فرعون خطأ فخرج منها خائفا يترقب."},{titleAr:"الوادي المقدس",textAr:"ذهب إلى مدين وتزوج ابنة شعيب، ثم عاد فكلمه الله عند جبل الطور، قال إني أنا ربك فاخلع نعليك إنك بالوادي المقدس طوى، وأنا اخترتك فاستمع لما يوحى."},{titleAr:"العصا والبحر",textAr:"أيده الله بالعصا واليد البيضاء، وفلق له البحر فكان كل فرق كالطود العظيم، فنجى بني إسرائيل وأغرق فرعون وجنوده، وكان موسى كليم الله وأولى العزم من الرسل."}]},{id:16,nameAr:"هارون عليه السلام",titleAr:"الوزير الصادق",icon:"\uD83D\uDDE3️",color:"#2A6A6A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/17.mp3"],chapters:[{titleAr:"طلب النصير",textAr:"لما كلف الله موسى بالرسالة قال رب اشرح لي صدري ويسر لي أمري واحلل عقدة من لساني يفقهوا قولي واجعل لي وزيرا من أهلي هارون أخي، فاستجاب الله له وجعل هارون نبيا."},{titleAr:"الفصاحة والحكمة",textAr:"كان هارون أفصح من موسى لسانا، وكان حليما رفيقا، ترك موسى قومه معه لما ذهب لميقات ربه، فكان نعم الخليفة الصابر على أذى بني إسرائيل."},{titleAr:"فتنة العجل",textAr:"لما عبد بنو إسرائيل العجل قال هارون يا قوم إنما فتنتم به وإن ربكم الرحمن فاتبعوني وأطيعوا أمري، فكادوا يقتلونه، فجاء موسى غاضبا فأخذ برأس أخيه يجره إليه، فقال ابن أم لا تأخذ بلحيتي."},{titleAr:"الوفاء والأخوة",textAr:"مات هارون قبل موسى في التيه، وكان مثالا للأخ الصادق الذي يعين أخاه على الحق، فاستحق أن يذكر في القرآن مقرونا بموسى دائما."}]},{id:17,nameAr:"داود عليه السلام",titleAr:"صاحب الزبور",icon:"\uD83C\uDFB5",color:"#4A3A6A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/23.mp3"],chapters:[{titleAr:"الشاب الشجاع",textAr:"كان داود شابا في جيش طالوت، فبرز لجالوت الجبار وقتله، وآتاه الله الملك والحكمة وعلمه مما يشاء، فصار ملكا نبيا يجمع بين القوة والإيمان."},{titleAr:"الزبور والتسبيح",textAr:"أنزل الله عليه الزبور، وكان حسن الصوت، إذا سبح تسبح معه الجبال والطير، قال تعالى يا جبال أوبي معه والطير، وألنا له الحديد، فكان يصنع الدروع ويسبح ربه."},{titleAr:"العدل والقضاء",textAr:"كان داود عادلا حكيما في قضائه، وخصمان تسورا المحراب فحكم بينهما بالحق، وكان كثير الصيام، يصوم يوما ويفطر يوما، وهو أحب الصيام إلى الله."},{titleAr:"المحراب والخشوع",textAr:"كان داود كثير العبادة، يقوم ثلث الليل، وخشع قلبه لله، وكان مثالا للملك العابد الذي لا تلهيه الدنيا عن ذكر الله ولو ملك مشارق الأرض ومغاربها."}]},{id:18,nameAr:"سليمان عليه السلام",titleAr:"الملك الحكيم",icon:"\uD83D\uDC51",color:"#6A4A1A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/24.mp3","https://media.islamway.net/lessons/awady/ALanbeYaa/25.mp3"],chapters:[{titleAr:"وراثة العلم",textAr:"ورث سليمان داود، وقال يا أيها الناس علمنا منطق الطير وأوتينا من كل شيء إن هذا لهو الفضل المبين، فكان يعرف لغة الطيور والنمل والجن."},{titleAr:"مملكة لا تنبغي",textAr:"سخر الله له الريح تجري بأمره، والشياطين كل بناء وغواص، وآتاه ملكا لا ينبغي لأحد من بعده، فسخر الجن يبنون له المحاريب والتماثيل والجفان كالجواب."},{titleAr:"النملة والهدهد",textAr:"سمع نملة تحذر قومها فتبسم ضاحكا من قولها، وتفقد الطير فقال ما لي لا أرى الهدهد، فجاءه بخبر سبأ وملكة بلقيس التي تعبد الشمس، فدعاها إلى الإسلام فأسلمت."},{titleAr:"الموت ودرس الجن",textAr:"مات سليمان متكئا على عصاه، وما دلهم على موته إلا دابة الأرض تأكل منسأته، فلما خر تبينت الجن أن لو كانوا يعلمون الغيب ما لبثوا في العذاب المهين."}]},{id:19,nameAr:"إلياس عليه السلام",titleAr:"نبي بعلبك",icon:"⚡",color:"#3A4A5A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/20.mp3"],chapters:[{titleAr:"قوم يعبدون بعلا",textAr:"أرسل الله إلياس إلى قوم في بعلبك كانوا يعبدون صنما يسمى بعلا، فقال أتدعون بعلا وتذرون أحسن الخالقين الله ربكم ورب آبائكم الأولين، فكذبوه."},{titleAr:"الثبات في الشدة",textAr:"صبر إلياس على أذى قومه ودعاهم إلى ترك عبادة الأوثان والرجوع إلى الله، فكان مثالا للنبي الذي لا يلين أمام الباطل ولو كان منتشرا."},{titleAr:"النجاة والاصطفاء",textAr:"نجى الله إلياس والذين آمنوا معه، وأهلك المكذبين، وقال تعالى سلام على إل ياسين إنا كذلك نجزي المحسنين إنه من عبادنا المؤمنين."},{titleAr:"ذكر خالد",textAr:"بقي ذكر إلياس خالدا في القرآن، ليكون عبرة لكل داعية يواجه قوما غرقوا في عبادة غير الله، أن الثبات على التوحيد هو النجاة."}]},{id:20,nameAr:"اليسع عليه السلام",titleAr:"خليفة إلياس",icon:"\uD83C\uDF31",color:"#2A5A3A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/20.mp3"],chapters:[{titleAr:"حامل الرسالة",textAr:"اليسع نبي من أنبياء بني إسرائيل، خلف إلياس في دعوته، وكان من الصالحين الصابرين، ذكره الله مع إسماعيل وإدريس وذا الكفل."},{titleAr:"الدعوة المستمرة",textAr:"واصل اليسع دعوة التوحيد بعد إلياس، وصبر على قومه، وكان يدعوهم إلى عبادة الله وحده وترك ما كان يعبد آباؤهم من دون الله."},{titleAr:"الثناء الإلهي",textAr:"قال تعالى واذكر إسماعيل واليسع وذا الكفل وكل من الأخيار، فكان من الأخيار الذين اصطفاهم الله لحمل رسالته وتبليغ دينه."},{titleAr:"قدوة الصالحين",textAr:"يعلمنا اليسع أن العمل الصالح لا ينقطع بموت نبي، بل يحمله من بعده نبي آخر، وهكذا تتواصل مسيرة الحق عبر الأجيال."}]},{id:21,nameAr:"يونس عليه السلام",titleAr:"ذو النون",icon:"\uD83D\uDC0B",color:"#1A3A5A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/21.mp3"],chapters:[{titleAr:"الغضب والخروج",textAr:"أرسل الله يونس إلى نينوى في العراق، فدعاهم فكذبوه، فغضب وخرج من قريته دون إذن من ربه، وركب سفينة فثقلت، فاقترعوا فساهم فكان من المدحضين."},{titleAr:"ظلمات ثلاث",textAr:"التقمه الحوت وهو مليم، فكان في ظلمة الليل وظلمة البحر وظلمة بطن الحوت، فنادى في الظلمات أن لا إله إلا أنت سبحانك إني كنت من الظالمين."},{titleAr:"الاستجابة",textAr:"استجاب الله له ونجاه من الغم، وكذلك ينجي المؤمنين، ونبذه بالعراء وهو سقيم، وأنبت عليه شجرة من يقطين، وعاد إلى قومه فآمنوا جميعا."},{titleAr:"قوم آمنوا",textAr:"يونس هو النبي الوحيد الذي آمن به قومه جميعا، مائة ألف أو يزيدون، فمتعهم الله إلى حين، وكان آية على أن الدعوة قد تثمر ولو بعد حين."}]},{id:22,nameAr:"زكريا عليه السلام",titleAr:"كافل مريم",icon:"\uD83D\uDD6F️",color:"#5A4A4A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/26.mp3"],chapters:[{titleAr:"شيخ بني إسرائيل",textAr:"كان زكريا نبيا صالحا من بني إسرائيل، كفل مريم ابنة عمران، وكلما دخل عليها المحراب وجد عندها رزقا، قال يا مريم أنى لك هذا قالت هو من عند الله."},{titleAr:"الدعاء الخفي",textAr:"بلغ زكريا من الكبر عتيا وامرأته عاقر، فدعا ربه دعاء خفيا قال رب إني وهن العظم مني واشتعل الرأس شيبا ولم أكن بدعائك رب شقيا، فاستجاب الله له."},{titleAr:"البشارة بيحيى",textAr:"نادته الملائكة وهو قائم يصلي في المحراب أن الله يبشرك بيحيى مصدقا بكلمة من الله وسيدا وحصورا ونبيا من الصالحين، فكانت معجزة الولد على الكبر."},{titleAr:"الصمت آية",textAr:"جعل الله آيته ألا يكلم الناس ثلاث ليال سويا، فكان يسبح بكرة وعشيا، وكان شاكرا لنعمة الله التي وهبته الولد بعد اليأس."}]},{id:23,nameAr:"يحيى عليه السلام",titleAr:"السيد الحصور",icon:"\uD83C\uDF3F",color:"#3A5A3A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/26.mp3"],chapters:[{titleAr:"الغلام الحكيم",textAr:"آتى الله يحيى الحكم صبيا، وكان تقيا برا بوالديه ولم يكن جبارا عصيا، وكان سيدا وحصورا لا يأتي النساء زهدا وعبادة، ونبيا من الصالحين."},{titleAr:"العلم والحكمة",textAr:"قال تعالى يا يحيى خذ الكتاب بقوة وآتيناه الحكم صبيا، فكان عالما حكيما منذ صغره، يبكي من خشية الله، ويعظ بني إسرائيل ويذكرهم بالله."},{titleAr:"الشهادة",textAr:"قتله بنو إسرائيل لما نهى ملكهم عن الزواج من محارمه، فقطعوا رأسه وقدموه لبغي، فمات شهيدا، وسلام عليه يوم ولد ويوم يموت ويوم يبعث حيا."},{titleAr:"الدم الذي يفور",textAr:"قيل إن دم يحيى ظل يفور حتى قتل بختنصر سبعين ألفا من بني إسرائيل انتقاما له، فكان دمه شاهدا على جريمة بني إسرائيل بقتلهم الأنبياء."}]},{id:24,nameAr:"عيسى عليه السلام",titleAr:"المسيح",icon:"✨",color:"#2A5A6A",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/28.mp3"],chapters:[{titleAr:"الميلاد المعجزة",textAr:"ولد عيسى من مريم العذراء بلا أب، بكلمة من الله، فجاءت به قومها تحمله قالوا يا مريم لقد جئت شيئا فريا، فأشارت إليه قال إني عبد الله آتاني الكتاب وجعلني نبيا."},{titleAr:"الآيات البينات",textAr:"كان عيسى يبرئ الأكمه والأبرص ويحيي الموتى بإذن الله، ويخلق من الطين كهيئة الطير فينفخ فيه فيكون طيرا بإذن الله، وينبئ الناس بما يأكلون وما يدخرون في بيوتهم."},{titleAr:"الحواريون",textAr:"آمن به الحواريون وقالوا نحن أنصار الله، وطلبوا مائدة من السماء، فأنزلها الله، وكان عيسى يدعو إلى التوحيد ويبشر برسول يأتي من بعده اسمه أحمد."},{titleAr:"الرفع والعودة",textAr:"مكر بنو إسرائيل به وأرادوا قتله، فرفعه الله إليه وما قتلوه وما صلبوه ولكن شبه لهم، وسينزل في آخر الزمان حكما عدلا يكسر الصليب ويقتل الخنزير ويضع الجزية."}]},{id:25,nameAr:"محمد ﷺ",titleAr:"خاتم الأنبياء",icon:"\uD83D\uDC9A",color:"#0F2C2C",audioList:["https://media.islamway.net/lessons/awady/ALanbeYaa/29.mp3"],chapters:[{titleAr:"المولد الشريف",textAr:"ولد محمد بن عبد الله في مكة عام الفيل، يتيما، فأرضعته حليمة السعدية، ونشأ صادقا أمينا، يحبه قومه ويلقبونه بالأمين، حتى جاءه الوحي في غار حراء اقرأ باسم ربك الذي خلق."},{titleAr:"الدعوة والصبر",textAr:"دعا قريشا ثلاث عشرة سنة في مكة فأوذي أشد الأذى، وصبر، ثم هاجر إلى المدينة فأسس دولة الإسلام، وجاهد في سبيل الله حتى أظهره الله على الدين كله."},{titleAr:"الخلق العظيم",textAr:"كان خلقه القرآن، وكان رحمة للعالمين، يعفو عمن ظلمه ويصل من قطعه، ويقول اذهبوا فأنتم الطلقاء يوم فتح مكة، وكان قرآنيا يمشي على الأرض."},{titleAr:"الختام والكمال",textAr:"قال تعالى اليوم أكملت لكم دينكم وأتممت عليكم نعمتي ورضيت لكم الإسلام دينا، ومات رسول الله بعد أن بلغ الرسالة وأدى الأمانة ونصح الأمة، فكان خاتم النبيين وسيد ولد آدم."}]}];function jl(){return new Promise((e,n)=>{let t=indexedDB.open(um,1);t.onupgradeneeded=()=>{let r=t.result;if(!r.objectStoreNames.contains(Ze))r.createObjectStore(Ze)},t.onsuccess=()=>e(t.result),t.onerror=()=>n(t.error)})}async function Cf(e,n){let t=await jl();return new Promise((r,l)=>{let o=t.transaction(Ze,"readwrite");o.objectStore(Ze).put(n,e),o.onco
