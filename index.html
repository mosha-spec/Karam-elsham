لث الأنبياء بعد آدم وشيث. علم الناس الكتابة والخياطة والحساب والفلك. كان صديقًا نبيًا، رفعه الله مكانًا عليًا. دعا قومه للتوحيد بعدما بدأ الانحراف بعد آدم، وصبر على تعليمهم.",lesson:"العلم عبادة، وتعليم الناس من أعظم القربات.",aya:"وَاذْكُرْ فِي الْكِتَابِ إِدْرِيسَ إِنَّهُ كَانَ صِدِّيقًا نَّبِيًّا"},{id:3,name:"نوح عليه السلام",en:"Nuh",kunya:"شيخ المرسلين",period:"950 سنة دعوة",startIndex:3,indices:[3],description:"لبث في قومه ألف سنة إلا خمسين عامًا يدعوهم ليلًا ونهارًا.",story:"أرسل الله نوحًا لقوم يعبدون الأصنام ودّ وسواع ويغوث. دعاهم 950 سنة فما آمن إلا قليل. أمره الله بصنع الفلك، وسخر منه قومه. جاء الطوفان وحمل فيه من كل زوجين اثنين، وغرق ابنه لأنه كان من الكافرين. واستوت السفينة على الجودي.",lesson:"الصبر على الدعوة، وأن النجاة فقط مع المؤمنين ولو كانوا قلة.",aya:"فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَامًا"},{id:4,name:"هود عليه السلام",en:"Hud",kunya:"نبي عاد",period:"قوم عاد - الأحقاف",startIndex:4,indices:[4],description:"أرسل إلى عاد أصحاب الأبنية العالية والقوة.",story:"عاد كانوا طوال الأجسام، بنوا المصانع والقصور وتجبروا وقالوا من أشد منا قوة. أرسل الله لهم هودًا فكذبوه. فأرسل الله عليهم ريحًا صرصرًا عاتية سبع ليال وثمانية أيام، فأهلكتهم ولم يبق منهم أحد إلا هود ومن آمن معه.",lesson:"القوة بدون إيمان هلاك، والتواضع نجاة.",aya:"وَتِلْكَ عَادٌ جَحَدُوا بِآيَاتِ رَبِّهِمْ"},{id:5,name:"صالح عليه السلام",en:"Salih",kunya:"نبي ثمود",period:"الحجر - ثمود",startIndex:5,indices:[5],description:"أرسل إلى ثمود الذين نحتوا الجبال بيوتًا.",story:"ثمود كانوا ينحتون الجبال، طلبوا آية فأخرج الله لهم ناقة عشراء من صخرة. قال لهم صالح لها شرب ولكم شرب يوم معلوم. فعقروها عنادًا، فأخذتهم الصيحة فأصبحوا في ديارهم جاثمين.",lesson:"معجزات الله لا يستهان بها، وعاقبة الظلم وخيمة.",aya:"هَٰذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً"},{id:6,name:"إبراهيم عليه السلام",en:"Ibrahim",kunya:"خليل الرحمن",period:"أبو الأنبياء",startIndex:6,indices:[6,7,8],description:"حطم الأصنام وألقي في النار فجعلها الله بردًا وسلامًا.",story:"وُلد إبراهيم في قوم يعبدون النجوم والأصنام. حاجّ أباه آزر وقومه بالحجة، وحطم أصنامهم إلا كبيرهم. ألقوه في النار فقال الله يا نار كوني بردًا وسلامًا. هاجر وابتلي بذبح ابنه إسماعيل، وببناء الكعبة معه. ولقب بخليل الرحمن لشدة توكله.",lesson:"التوحيد فطرة، ومن ترك شيئًا لله عوضه الله خيرًا.",aya:"وَإِذِ ابْتَلَىٰ إِبْرَاهِيمَ رَبُّهُ بِكَلِمَاتٍ"},{id:7,name:"لوط عليه السلام",en:"Lut",kunya:"نبي المؤتفكات",period:"قرى سدوم",startIndex:9,indices:[9],description:"أرسل إلى قوم يأتون الفاحشة ما سبقهم بها أحد.",story:"أرسل لوط إلى قوم سدوم الذين ابتدعوا فاحشة لم يسبقهم إليها أحد. دعاهم فلم يستجيبوا. أرسل الله ملائكة بصورة شباب حسان، وأراد القوم الفاحشة بهم، فطمست أعينهم، وقلبت قراهم، وأمطر عليهم حجارة من سجيل منضود.",lesson:"الفاحشة تهدم المجتمعات، والستر والعفاف نجاة.",aya:"وَلُوطًا إِذْ قَالَ لِقَوْمِهِ أَتَأْتُونَ الْفَاحِشَةَ"},{id:8,name:"إسماعيل عليه السلام",en:"Ismail",kunya:"الذبيح",period:"مكة المكرمة",startIndex:7,indices:[7],description:"صادق الوعد، فدى الله رقبته بذبح عظيم.",story:"إسماعيل ابن إبراهيم من هاجر، تركهم إبراهيم بواد غير ذي زرع ففجر الله زمزم. رأى إبراهيم أنه يذبحه فاستسلم إسماعيل وقال افعل ما تؤمر. ففداه الله بكبش عظيم. ساعد أباه في رفع قواعد البيت الحرام.",lesson:"الاستسلام لأمر الله هو قمة العبودية.",aya:"وَاذْكُرْ فِي الْكِتَابِ إِسْمَاعِيلَ إِنَّهُ كَانَ صَادِقَ الْوَعْدِ"},{id:9,name:"إسحاق عليه السلام",en:"Ishaq",kunya:"نبي الشام",period:"بشارة الكبر",startIndex:8,indices:[8],description:"بشرت به الملائكة سارة وهي عجوز عقيم.",story:"بشرت الملائكة إبراهيم وسارة بإسحاق نبيًا من الصالحين ومن ورائه يعقوب. وُلد بعد إسماعيل، وكان نبيًا مباركًا، ومن نسله جاء بنو إسرائيل. كان حليمًا كأبيه.",lesson:"لا يأس من روح الله، والعطاء يأتي بعد الصبر.",aya:"وَبَشَّرْنَاهُ بِإِسْحَاقَ نَبِيًّا مِّنَ الصَّالِحِينَ"},{id:10,name:"يعقوب عليه السلام",en:"Yaqub",kunya:"إسرائيل",period:"أبو الأسباط",startIndex:10,indices:[10],description:"إسرائيل، أبو الأسباط الاثني عشر.",story:"يعقوب بن إسحاق، لقبه إسرائيل. ابتلي بفقد يوسف أربعين سنة وبكى حتى ابيضت عيناه. صبر صبرًا جميلًا، وجمع الله شمله بيوسف في مصر. أوصى بنيه بالتوحيد عند موته.",lesson:"الصبر الجميل لا شكوى فيه إلا لله.",aya:"إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ"},{id:11,name:"شعيب عليه السلام",en:"Shuayb",kunya:"خطيب الأنبياء",period:"مدين",startIndex:10,indices:[10],description:"أرسل إلى أهل مدين الذين يبخسون الميزان.",story:"أهل مدين كانوا يطففون الكيل والميزان ويقطعون الطريق. دعاهم شعيب للتوحيد ووفاء الكيل، فكذبوه وقالوا أصلاتك تأمرك. فأخذتهم الصيحة والرجفة فأصبحوا في ديارهم جاثمين.",lesson:"الاقتصاد القائم على الغش زائل، والبركة في الوفاء.",aya:"أَوْفُوا الْكَيْلَ وَلَا تَكُونُوا مِنَ الْمُخْسِرِينَ"},{id:12,name:"يوسف عليه السلام",en:"Yusuf",kunya:"الصديق",period:"من القصر إلى العرش",startIndex:11,indices:[11,12,13],description:"أحسن القصص، من الجب إلى خزائن الأرض.",story:"رأى يوسف أحد عشر كوكبًا والشمس والقمر له ساجدين. حسده إخوته وألقوه في الجب، ثم بيع بثمن بخس. فتنته امرأة العزيز فاستعصم وسجن ظلمًا. فسر رؤيا الملك وخرج من السجن وزيرًا. ثم جاء إخوته فعرفهم وقال لا تثريب عليكم اليوم.",lesson:"من يتق ويصبر فإن الله لا يضيع أجر المحسنين.",aya:"نَحْنُ نَقُصُّ عَلَيْكَ أَحْسَنَ الْقَصَصِ"},{id:13,name:"أيوب عليه السلام",en:"Ayyub",kunya:"الصابر",period:"الابتلاء العظيم",startIndex:14,indices:[14],description:"ابتلي في ماله وولده وجسده فصبر ثماني عشرة سنة.",story:"كان أيوب غنيًا كثير المال والولد، فابتلي بذهاب ماله وولده ومرض جسده حتى هجره الناس إلا زوجته. دعا ربه أني مسني الضر وأنت أرحم الراحمين. فأمره الله أن يركض برجله فاغتسل وشرب فشفاه الله ورد له أهله ومثلهم معهم.",lesson:"الصبر مفتاح الفرج، والشكوى لله لا تنافي الصبر.",aya:"إِنَّا وَجَدْنَاهُ صَابِرًا نِّعْمَ الْعَبْدُ"},{id:14,name:"يونس عليه السلام",en:"Yunus",kunya:"ذو النون",period:"نينوى - بطن الحوت",startIndex:15,indices:[15],description:"التقمه الحوت وهو مليم، فنادى في الظلمات.",story:"أرسل يونس إلى أهل نينوى فكذبوه، فغضب وخرج دون إذن، فركب سفينة فاقترعوا فكان من المدحضين. التقمه الحوت ونادى في الظلمات لا إله إلا أنت سبحانك إني كنت من الظالمين. فاستجاب الله له ونجاه، وآمن قومه جميعًا مائة ألف أو يزيدون.",lesson:"الدعاء في الظلمات ينجي، ولا تيأس من هداية أحد.",aya:"فَنَادَىٰ فِي الظُّلُمَاتِ أَن لَّا إِلَٰهَ إِلَّا أَنتَ"},{id:15,name:"موسى عليه السلام",en:"Musa",kunya:"كليم الله",period:"بني إسرائيل وفرعون",startIndex:16,indices:[16,17,18,19,20],description:"أعظم قصص القرآن، من التابوت إلى مناجاة الطور.",story:"وُلد موسى وفرعون يقتل الأبناء، فألقته أمه في التابوت في اليم فالتقطه آل فرعون. تربى في قصره ثم قتل رجلًا فخرج إلى مدين وتزوج ابنة شعيب. كلمه الله عند الطور وأرسله بآيات تسع إلى فرعون. شق الله له البحر فأنجاه وأغرق فرعون، وأنزل عليه التوراة.",lesson:"التوكل على الله يقلب الخوف أمنًا، والعصا تصبح حية بإذن الله.",aya:"وَكَلَّمَ اللَّهُ مُوسَىٰ تَكْلِيمًا"},{id:16,name:"هارون عليه السلام",en:"Harun",kunya:"وزير موسى",period:"السند والعضد",startIndex:21,indices:[21],description:"أفصح لسانًا، كان عونًا لموسى في دعوته.",story:"طلب موسى من ربه أن يجعل هارون أخاه وزيرًا يشدد به أزره ويشركه في أمره. كان هارون حليمًا فصيحًا، خلفه موسى على قومه عند ذهابه لمناجاة ربه، فعبدوا العجل، فصبر عليهم حتى رجع موسى.",lesson:"الأخوة في الله سند، والحلم في الفتن حكمة.",aya:"وَاجْعَل لِّي وَزِيرًا مِّنْ أَهْلِي هَارُونَ أَخِي"},{id:17,name:"داود عليه السلام",en:"Dawud",kunya:"الأواب",period:"الملك والنبوة",startIndex:22,indices:[22],description:"آتاه الله الملك والحكمة وألان له الحديد.",story:"كان داود شابًا صغيرًا قتل جالوت العملاق بمقلاع، فآتاه الله الملك والنبوة. كان يصوم يومًا ويفطر يومًا، ويقوم ثلث الليل. ألان الله له الحديد يعمل الدروع، وأعطاه الزبور، وكانت الجبال والطير تسبح معه.",lesson:"القوة مع العبادة، والشكر يزيد النعم.",aya:"وَلَقَدْ آتَيْنَا دَاوُودَ مِنَّا فَضْلًا"},{id:18,name:"سليمان عليه السلام",en:"Sulayman",kunya:"نبي المُلك العظيم",period:"الريح والجن",startIndex:23,indices:[23,24],description:"سخر الله له الريح والجن والطير وفهم منطق الطير.",story:"ورث سليمان داود وملكه. دعا ربه ملكًا لا ينبغي لأحد من بعده فاستجاب له. سخر الله له الريح تجري بأمره، والجن يعملون له، وفهم كلام النملة وحديث الهدهد. وقصته مع ملكة سبأ بلقيس وكتابه إليها حتى أسلمت.",lesson:"الملك ابتلاء، وشكر النعمة يحفظها.",aya:"قَالَ رَبِّ اغْفِرْ لِي وَهَبْ لِي مُلْكًا"},{id:19,name:"إلياس عليه السلام",en:"Ilyas",kunya:"نبي بعلبك",period:"مقاوم البعل",startIndex:23,indices:[23],description:"أرسل إلى قوم يعبدون بعلًا صنمًا.",story:"أرسل إلياس إلى قوم في بعلبك يعبدون صنمًا اسمه بعل. قال لهم أتدعون بعلًا وتذرون أحسن الخالقين. فكذبوه فدعا عليهم بحبس المطر ثلاث سنين حتى هلكت دوابهم، ثم آمنوا ثم نكثوا.",lesson:"الثبات على التوحيد في زمن الشرك جهاد.",aya:"وَإِنَّ إِلْيَاسَ لَمِنَ الْمُرْسَلِينَ"},{id:20,name:"اليسع عليه السلام",en:"AlYasa",kunya:"الخلف الصالح",period:"بعد إلياس",startIndex:24,indices:[24],description:"خليفة إلياس في الدعوة إلى الله.",story:"اليسع كان من الأنبياء الذين ذكرهم الله في القرآن وأثنى عليهم، خلف إلياس في بني إسرائيل، دعاهم للتوحيد وصبر على أذاهم. ذكره الله في جملة الأخيار.",lesson:"خلافة الحق شرف.",aya:"وَاذْكُرْ إِسْمَاعِيلَ وَالْيَسَعَ وَذَا الْكِفْلِ"},{id:21,name:"زكريا عليه السلام",en:"Zakariya",kunya:"كافل مريم",period:"المحراب",startIndex:25,indices:[25],description:"ناجى ربه نداء خفيًا فرزقه يحيى على الكبر.",story:"كان زكريا نجارًا وكافل مريم في المحراب، كلما دخل عليها وجد عندها رزقًا. اشتاق للولد فدعا ربه نداء خفيًا رب لا تذرني فردًا. فبشره الله بيحيى مصدقًا بكلمة من الله وسيدًا وحصورًا ونبيًا من الصالحين رغم كبر سنه وعقر امرأته.",lesson:"الدعاء الخفي سهم لا يخيب.",aya:"ذِكْرُ رَحْمَتِ رَبِّكَ عَبْدَهُ زَكَرِيَّا"},{id:22,name:"يحيى عليه السلام",en:"Yahya",kunya:"السيد الحصور",period:"الشهيد",startIndex:25,indices:[25],description:"آتاه الله الحكم صبيًا، وقتل شهيدًا.",story:"يحيى ابن زكريا، آتاه الله الحكم صبيًا، كان سيدًا حصورًا زاهدًا، يأكل من ورق الشجر ويبكي من خشية الله. أمره الله أن يأخذ الكتاب بقوة، ونهى قومه عن نكاح محرم فقتله ملك ظالم بسبب بغي.",lesson:"قول الحق قد يكلف الروح، لكنه حياة.",aya:"يَا يَحْيَىٰ خُذِ الْكِتَابَ بِقُوَّةٍ"},{id:23,name:"مريم عليها السلام",en:"Maryam",kunya:"البتول",period:"اصطفاء",startIndex:26,indices:[26],description:"اصطفاها الله وطهرها على نساء العالمين.",story:"مريم بنت عمران، نذرتها أمها لله، كفلها زكريا. كانت عابدة قانتة، اصطفاها الله على نساء العالمين. بشرتها الملائكة بكلمة منه اسمه المسيح عيسى ابن مريم وجيهًا في الدنيا والآخرة. ثبتت أمام اتهام قومها.",lesson:"العفة والعبادة ترفع المرأة لمقام لم يبلغه كثير من الرجال.",aya:"وَإِذْ قَالَتِ الْمَلَائِكَةُ يَا مَرْيَمُ إِنَّ اللَّهَ اصْطَفَاكِ"},{id:24,name:"عيسى عليه السلام",en:"Isa",kunya:"روح الله وكلمته",period:"المسيح",startIndex:27,indices:[27],description:"كلمة الله ألقاها إلى مريم وروح منه.",story:"وُلد عيسى بلا أب بمعجزة، تكلم في المهد صبيًا وقال إني عبد الله آتاني الكتاب وجعلني نبيًا. كان يبرئ الأكمه والأبرص ويحيي الموتى بإذن الله، وينزل عليه مائدة من السماء. رفعه الله إليه وينزل آخر الزمان حكمًا مقسطًا.",lesson:"المعجزة لا تغني عن الإيمان، والإسلام دين جميع الأنبياء.",aya:"إِذْ قَالَ اللَّهُ يَا عِيسَى ابْنَ مَرْيَمَ اذْكُرْ نِعْمَتِي عَلَيْكَ"},{id:25,name:"محمد ﷺ",en:"Muhammad",kunya:"خاتم النبيين",period:"الرحمة المهداة",startIndex:28,indices:[28],description:"خاتم الأنبياء وسيد ولد آدم، بُعث رحمة للعالمين.",story:"محمد بن عبد الله، خاتم النبيين، وُلد يتيمًا ورعاه جده وأبو طالب. بُعث في الأربعين، فدعا قومه 23 سنة، أوذي وهاجر وبنى دولة الإسلام في المدينة. نزل عليه القرآن معجزة خالدة، وفتح الله له مكة، واكتمل الدين. قصصه في الصبر والرحمة والعدل لا تنتهي.",lesson:"به اكتمل الدين، ومن أطاعه فقد أطاع الله، والصلاة عليه عبادة.",aya:"وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ"}];function $i(){let[e,n]=x.useState(null),[t,r]=x.useState(null),[l,u]=x.useState(""),[o,i]=x.useState(!1),[a,c]=x.useState(!1),[m,h]=x.useState(0),[v,k]=x.useState(sn[0]),[E,C]=x.useState("قصة آدم - بداية الخلق"),[I,f]=x.useState(0),[s,d]=x.useState(0),[g,z]=x.useState(!1),[N,T]=x.useState(!1),[P,Y]=x.useState(!1),[L,_e]=x.useState(!1),[Rt,Hi]=x.useState(null),[Bi,Hr]=x.useState(!1),M=x.useRef(null),Qi=x.useRef(null),Dn=x.useRef(null),Ge=x.useRef(null);x.useEffect(()=>{let S=document.createElement("link");if(S.href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap",S.rel="stylesheet",document.head.appendChi
