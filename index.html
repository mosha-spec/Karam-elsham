 وقد شرف الله آدم به"],dua:"رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ",ayah:"وَعَلَّمَ آدَمَ الْأَسْمَاءَ كُلَّهَا"},{id:2,name:"إدريس",title:"أول من خط بالقلم",period:"بعد آدم بـ 300 عام",icon:"✒️",gradient:"from-[#1e3a3a] to-[#2d5a5a]",accent:"#6fb3a6",story:[{title:"البداية",icon:"✨",text:"إدريس عليه السلام هو أول من أعطي النبوة بعد آدم وشيث، وهو جد أبي نوح. كان صديقاً نبياً، رفيع المنزلة، عالي القدر. عاش في مصر ودعا قومه إلى التوحيد وعبادة الله وحده، وإلى مكارم الأخلاق والعدل. كان أول من خط بالقلم، وأول من خاط الثياب ولبس المخيط، وكان الناس قبله يلبسون الجلود."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDCD6",text:"دعا إدريس قومه إلى دين الله، فأطاعه قليل وعصاه كثير، وكان قومه يعبدون النار ويعتدون. فأمره الله بالهجرة، فهاجر مع من آمن معه من بابل إلى مصر، وهناك علم الناس علوماً كثيرة، علم الفلك والحساب والطب، ووضع قواعد العمران وبناء المدن، وعلمهم الزراعة وتخطيط المدن، فكان معلم الحضارة الإنسانية."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"رفع الله إدريس مكاناً علياً، كما قال تعالى. قيل رفعه إلى السماء الرابعة حياً، ولم يمت كبقية البشر في الأرض، بل قبضت روحه هناك. وكانت معجزته في العلم الذي آتاه الله، فكان يتكلم باثنتين وسبعين لغة، وعلم قومه لغة لم يعرفوها، وكتب الله له أجر كل من عمل بما علمه من خير إلى يوم القيامة."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"إدريس يعلمنا قيمة العلم والكتابة، وأن أول قلم خط في التاريخ كان قلم نبي. وأن الحضارة لا تقوم إلا على العلم والإيمان معاً. وأن الداعية قد يحتاج للهجرة بدعوته إلى أرض خصبة، وأن الله يرفع بالعلم أقواماً، وأن العمل والصناعة عبادة إذا اقترنت بالنية الصالحة."}],lessons:["العلم أساس الحضارة وأول من خط بالقلم نبي","الهجرة للدعوة سنة الأنبياء","من سن سنة حسنة فله أجرها وأجر من عمل بها"],dua:"اللهم علمني ما ينفعني وانفعني بما علمتني وزدني علما",ayah:"وَرَفَعْنَاهُ مَكَانًا عَلِيًّا"},{id:3,name:"نوح",title:"شيخ المرسلين",period:"950 سنة دعوة",icon:"\uD83D\uDEF3️",gradient:"from-[#0c2a4a] via-[#184a7a] to-[#3a8fb7]",accent:"#3a8fb7",story:[{title:"البداية",icon:"✨",text:"نوح عليه السلام أول رسول أرسله الله إلى أهل الأرض بعد أن انتشر الشرك وعبادة الأصنام ود وسواع ويغوث ويعوق ونسر، وكان قومه أول من عبد الأصنام. لبث في قومه ألف سنة إلا خمسين عاماً يدعوهم ليلاً ونهاراً، سراً وجهاراً، فما آمن معه إلا قليل، وكان كبراء قومه يسخرون منه ويتهمونه بالضلال والجنون، ويتواصون بعدم سماعه."},{title:"الدعوة والابتلاء",icon:"\uD83C\uDF0A",text:"صبر نوح صبراً لم يصبره أحد، كانوا يضربونه حتى يغشى عليه، فيقوم ويدعوهم: اللهم اغفر لقومي فإنهم لا يعلمون. وكان ابنه وزوجته من الكافرين، فكان أشد بلاء. فلما يئس من إيمانهم دعا ربه: رب لا تذر على الأرض من الكافرين ديارا. فأوحى الله إليه أن يصنع الفلك، فكان كلما مر عليه ملأ من قومه سخروا منه: أتتخذ سفينة في الصحراء؟!"},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"جاء الطوفان، وفار التنور، وانهمر المطر من السماء كأفواه القرب، وتفجرت الأرض عيوناً، وارتفع الماء حتى غطى الجبال، وحملت السفينة المؤمنين وزوجين من كل الكائنات. نادى نوح ابنه: يا بني اركب معنا، فقال: سآوي إلى جبل يعصمني من الماء، قال: لا عاصم اليوم من أمر الله. فحال بينهما الموج فكان من المغرقين. واستوت السفينة على جبل الجودي."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"قصة نوح مدرسة في الصبر الطويل، والدعوة بالحكمة والموعظة الحسنة، وأن النصر مع الصبر. وأن القرابة لا تنفع بلا إيمان، فابن نبي وزوجة نبي في النار. وأن الله ينجي المؤمنين ولو كانوا قلة، وأن السفينة رمز النجاة بالإيمان والعمل الصالح في بحر الفتن."}],lessons:["الصبر الطويل مفتاح النصر - 950 عاماً دعوة","الإيمان هو الرابطة الحقيقية لا النسب","سفينة النجاة هي الإيمان في زمن الطوفان"],dua:"رَّبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَن دَخَلَ بَيْتِيَ مُؤْمِنًا",ayah:"فَأَنجَيْنَاهُ وَمَن مَّعَهُ فِي الْفُلْكِ الْمَشْحُونِ"},{id:4,name:"هود",title:"أخو عاد",period:"قوم عاد - الأحقاف",icon:"\uD83C\uDFDC️",gradient:"from-[#5a3a1a] to-[#D4AF37]",accent:"#D4AF37",story:[{title:"البداية",icon:"✨",text:"أرسل الله هوداً إلى قوم عاد، وكانوا يسكنون الأحقاف بين اليمن وعمان، وكانوا عمالقة أقوياء، بنوا المصانع والقصور، ونحتوا الجبال، وقالوا من أشد منا قوة. كانوا يعبدون الأصنام صداء وصمود والهباء، فجاءهم هود يدعوهم إلى عبادة الله وحده، ويذكرهم بنعمة القوة والعمران، ويحذرهم من بطش الله."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDCA8",text:"قال قوم عاد لهود: إنا لنراك في سفاهة وإنا لنظنك من الكاذبين. وسخروا منه وقالوا أجئتنا لتأفكنا عن آلهتنا؟ فما كان جواب هود إلا أن قال: إني أشهد الله واشهدوا أني بريء مما تشركون. فتحداهم أن يكيدوه جميعاً ثم لا ينظروه، متوكلاً على الله. فأمسك الله عنهم المطر ثلاث سنين حتى جهدوا، ثم ساق إليهم سحاباً حسبوه غيثاً."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"كانت الريح العقيم هي عذاب عاد، ريح صرصر عاتية، سخرها الله عليهم سبع ليال وثمانية أيام حسوماً، فترى القوم فيها صرعى كأنهم أعجاز نخل خاوية. كانت الريح تحمل الرجل منهم إلى السماء ثم تكبه على أم رأسه فتدق عنقه. فأصبحوا لا يرى إلا مساكنهم. وأما هود ومن آمن معه فنجاهم الله برحمة منه."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"قوة البنيان لا تمنع من بأس الله، والغرور بالقوة مهلكة. وأن النعم إذا لم تشكر زالت، وأن التوكل على الله هو القوة الحقيقية. وقوم عاد ذكرهم القرآن ليكونوا عبرة لكل متكبر جبار يظن أنه لا يقدر عليه أحد."}],lessons:["القوة الحقيقية في التوكل لا في البنيان","الاستغفار يجلب القوة والرزق","الغرور يهلك الأمم مهما بلغت"],dua:"إِنِّي تَوَكَّلْتُ عَلَى اللَّهِ رَبِّي وَرَبِّكُم",ayah:"وَأَمَّا عَادٌ فَأُهْلِكُوا بِرِيحٍ صَرْصَرٍ عَاتِيَةٍ"},{id:5,name:"صالح",title:"نبي ثمود",period:"الحجر - مدائن صالح",icon:"\uD83D\uDC2A",gradient:"from-[#4a3a2a] via-[#8a6a3a] to-[#d4b07a]",accent:"#d4b07a",story:[{title:"البداية",icon:"✨",text:"أرسل الله صالحاً إلى ثمود، وكانوا قوماً أقوياء ينحتون من الجبال بيوتاً، ويسكنون سهول الحجر شمال الجزيرة. كانوا يعبدون الأصنام، فدعاهم صالح إلى التوحيد، وذكرهم بنعمة الله إذ جعلهم خلفاء من بعد عاد وبوأهم في الأرض يتخذون من سهولها قصوراً وينحتون الجبال بيوتاً. وكان صالح من أشرفهم نسباً وأكرمهم."},{title:"الدعوة والابتلاء",icon:"\uD83E\uDEA8",text:"طلب قوم ثمود من صالح معجزة، وقالوا أخرج لنا من هذه الصخرة ناقة حمراء عشراء. فدعا صالح ربه، فتمخضت الصخرة وانشقت وخرجت منها ناقة عظيمة عشراء كما طلبوا، وكانت تشرب ماء البئر يوماً وتسقيهم لبناً يكفيهم يوماً. وقال لهم صالح: هذه ناقة الله لكم آية فذروها تأكل في أرض الله ولا تمسوها بسوء."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"عقر قوم ثمود الناقة بعد أن اتفق تسعة رهط على قتلها، وكان أشقاهم قدار بن سالف. فعقرها، فقال لهم صالح: تمتعوا في داركم ثلاثة أيام ذلك وعد غير مكذوب. فأصبحوا ينتظرون العذاب، فجاءتهم الصيحة، صيحة جبريل، فأصبحوا في ديارهم جاثمين، كأن لم يغنوا فيها. ونجى الله صالحاً والذين آمنوا معه."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الناقة آية الله، ومن يعتدي على آيات الله يهلك. وأن المجتمع إذا سكت على الظالم هلك معه، وأن ثلاثة أيام مهلة للتوبة. وأن العمران والحضارة لا تغني عن الإيمان، ومدائن صالح اليوم شاهدة على بأس الله."}],lessons:["آيات الله لا يستهان بها ومن يعتدي عليها يهلك","سكوت الصالحين عن الظلم هلاك للجميع","الحضارة بلا إيمان زائلة"],dua:"رَبِّ انصُرْنِي عَلَى الْقَوْمِ الْمُفْسِدِينَ",ayah:"وَيَا قَوْمِ هَٰذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً"},{id:6,name:"إبراهيم",title:"خليل الرحمن",period:"بابل - أبو الأنبياء",icon:"\uD83D\uDD25",gradient:"from-[#2c1a0f] via-[#8a4a1a] to-[#D4AF37]",accent:"#D4AF37",story:[{title:"البداية",icon:"✨",text:"ولد إبراهيم في بابل، في قوم يعبدون الأصنام والكواكب، وأبوه آزر كان يصنع الأصنام. فأنار الله قلبه بالتوحيد منذ صغره، فأخذ يحاج قومه: ما هذه التماثيل التي أنتم لها عاكفون؟ ثم نظر إلى الكوكب والقمر والشمس، وقال: لا أحب الآفلين، إني وجهت وجهي للذي فطر السماوات والأرض حنيفاً. فكان أول من أقام الحجة على عباد الأصنام والكواكب بالعقل والبرهان."},{title:"الدعوة والابتلاء",icon:"\uD83E\uDE93",text:"كسر إبراهيم أصنام قومه إلا كبيرهم، وعلق الفأس في عنقه، فلما سألوه قال: بل فعله كبيرهم هذا فاسألوهم إن كانوا ينطقون. فبهتوا. فقرر النمرود الجبار إحراقه، فجمعوا الحطب شهراً، وأوقدوا ناراً عظيمة حتى كانت الطير تحترق فوقها، ووضعوه في المنجنيق وقذفوه في النار. فقال إبراهيم: حسبي الله ونعم الوكيل. فقال الله: يا نار كوني برداً وسلاماً على إبراهيم."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"كانت النار برداً وسلاماً، لم تحرق إلا وثاقه، وبقي فيها أياماً، فكانت معجزة باهرة. ثم ابتلاه الله بذبح ابنه إسماعيل، فرأى في المنام أنه يذبحه، فاستسلم هو وابنه لأمر الله، فلما أسلما وتله للجبين، ناداه الله أن يا إبراهيم قد صدقت الرؤيا، وفديناه بذبح عظيم. وبنى مع ابنه الكعبة، فكان إمام الموحدين وخليل الرحمن."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"إبراهيم أبو الأنبياء، ومنه جاءت كل الرسالات. يعلمنا أن التوحيد فطرة وعقل، وأن النار لا تحرق إلا بإذن الله، وأن الاستسلام لله هو الإسلام الحق. وأن الابتلاء على قدر الإيمان، وأن الله لا يضيع أجر من أحسن عملاً، وأن الكعبة بناها نبي وابنه لتكون قبلة الموحدين إلى قيام الساعة."}],lessons:["حسبنا الله ونعم الوكيل تطفئ نار الدنيا والآخرة","الإسلام هو الاستسلام الكامل لأمر الله","من ترك شيئاً لله عوضه الله خيراً منه"],dua:"رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ - رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ",ayah:"إِنَّ إِبْرَاهِيمَ كَانَ أُمَّةً قَانِتًا لِّلَّهِ حَنِيفًا"},{id:7,name:"لوط",title:"ابن أخي إبراهيم",period:"سدوم - الأردن",icon:"\uD83C\uDFDA️",gradient:"from-[#1a2a1a] to-[#4a6a4a]",accent:"#6a9a6a",story:[{title:"البداية",icon:"✨",text:"لوط عليه السلام ابن أخي إبراهيم، آمن معه وهاجر معه من بابل إلى الشام، ثم أرسله الله إلى قرى سدوم وعمورة في غور الأردن، وكان قومه يفعلون فاحشة لم يسبقهم إليها أحد من العالمين، يأتون الرجال شهوة من دون النساء، ويقطعون السبيل، ويأتون في ناديهم المنكر. فدعاهم لوط إلى الطهارة والتوبة والزواج الشرعي."},{title:"الدعوة والابتلاء",icon:"⚖️",text:"قال لوط لقومه: أتأتون الفاحشة ما سبقكم بها من أحد من العالمين؟ إنكم لتأتون الرجال شهوة من دون النساء بل أنتم قوم مسرفون. فكان جواب قومه: أخرجوا آل لوط من قريتكم إنهم أناس يتطهرون! وكان قومه يهددونه بالرجم والإخراج. وكانت امرأته كافرة خبيثة تدل قومها على ضيوفه، فكانت عذاباً عليه في بيته."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"أرسل الله ملائكة على صورة شبان حسان إلى لوط، فضاق بهم ذرعاً، وجاء قومه يهرعون إليه، فقال: هؤلاء بناتي هن أطهر لكم. فلم ينتهوا. فقالت الملائكة: يا لوط إنا رسل ربك لن يصلوا إليك، فأسر بأهلك بقطع من الليل ولا يلتفت منكم أحد إلا امرأتك. فقلب جبريل قراهم، فجعل عاليها سافلها، وأمطر عليهم حجارة من سجيل منضود، فكان البحر الميت اليوم مكانهم."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الفطرة إذا انتكست هلك صاحبها، والطهارة فضيلة حتى عند الفجار يعيرون بها المتطهرين. وأن الله يمهل ولا يهمل، وأن قرى قوم لوط آية باقية إلى اليوم، بحر لا يعيش فيه شيء، ليكون عبرة لمن يخالف الفطرة السوية التي فطر الله الناس عليها."}],lessons:["الفطرة السليمة لا تبدل ومن انتكس هلك","الطهارة قوة حتى لو عيرك بها الناس","من دل على الفاحشة شريك فيها ولو كان زوج نبي"],dua:"رَبِّ نَجِّنِي وَأَهْلِي مِمَّا يَعْمَلُونَ",ayah:"فَجَعَلْنَا عَالِيَهَا سَافِلَهَا وَأَمْطَرْنَا عَلَيْهِمْ حِجَارَةً"},{id:8,name:"إسماعيل",title:"الذبيح",period:"مكة - جد العرب",icon:"\uD83D\uDC11",gradient:"from-[#2a2a1a] to-[#8a7a3a]",accent:"#c9b26a",story:[{title:"البداية",icon:"✨",text:"إسماعيل ابن إبراهيم من هاجر المصرية، ولد بعد شوق طويل لأبيه. أمر الله إبراهيم أن يترك زوجته وابنه الرضيع في واد غير ذي زرع عند البيت الحرام، فتركهم ومعهم جراب تمر وسقاء ماء، ثم انصرف. فقالت هاجر: آلله أمرك بهذا؟ قال: نعم، قالت: إذن لا يضيعنا. ونفد الماء، فصارت تسعى بين الصفا والمروة سبعاً تبحث عن الماء، حتى نبع ماء زمزم من تحت قدم إسماعيل."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDD2A",text:"شب إسماعيل وتعلم العربية من جرهم، وكان صادق الوعد، وكان يأمر أهله بالصلاة والزكاة. ورأى إبراهيم في المنام أنه يذبحه، فقال إسماعيل: يا أبت افعل ما تؤمر ستجدني إن شاء الله من الصابرين. فلما أسلم وتله للجبين، فداه الله بذبح عظيم، بكبش من الجنة. فكان الذبيح الذي افتداه الله، وبقيت سنته في الحج والأضحية إلى يوم القيامة."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"ماء زمزم معجزة باقية، نبعت من الصحراء بضربة جناح جبريل، لا تنضب منذ آلاف السنين، طعام طعم وشفاء سقم. وبنى إسماعيل مع أبيه الكعبة، يرفعان القواعد ويقولان: ربنا تقبل منا إنك أنت السميع العليم. وكان إسماعيل نبياً رسولاً، يبلغ دين أبيه إبراهيم الحنيفية، وهو جد العرب المستعربة، ومن نسله خاتم الأنبياء محمد ﷺ."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الصبر على أمر الله يورث الفرج، والسعي بين الصفا والمروة تخليد لسعي أم صابرة توكلت على الله. والذبح فداء، والأضحية سنة إبراهيم وإسماعيل، والكعبة بناها أب وابنه بالطاعة، ومن صلب إسماعيل خرج خير البشر."}],lessons:["من يتوكل على الله لا يضيعه - قصة زمزم","بر الوالدين وطاعة الأمر الإلهي ولو كان ذبحاً","السعي سبب والرزق من الله"],dua:"رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ",ayah:"وَاذْكُرْ فِي الْكِتَابِ إِسْمَاعِيلَ إِنَّهُ كَانَ صَادِقَ الْوَعْدِ"},{id:9,name:"إسحاق",title:"الغلام العليم",period:"الشام - فلسطين",icon:"\uD83C\uDF19",gradient:"from-[#1a2a3a] to-[#5a7a9a]",accent:"#7aa0c0",story:[{title:"البداية",icon:"✨",text:"إسحاق ابن إبراهيم من زوجته سارة، بشرت به الملائكة إبراهيم وسارة وكانت عجوزاً عقيماً، فضحكت سارة تعجباً، فقالت الملائكة: أتعجبين من أمر الله؟ رحمة الله وبركاته عليكم أهل البيت. فولد إسحاق غلاماً عليماً، وكان نبياً مباركاً، ومن نسله جاء بنو إسرائيل، وكل أنبياء بني إسرائيل من ذريته."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDD4A️",text:"عاش إسحاق في الشام، يدعو إلى ملة أبيه إبراهيم حنيفاً، ويعلم الناس التوحيد. وكان رجلاً مسالماً، يحب السلام، تزوج رفقة، فولدت له العيص ويعقوب، وكان يحب العيص أكثر، بينما كانت أمه تحب يعقوب. وبارك إسحاق يعقوب بالدعوة والنبوة، فكان يعقوب هو إسرائيل الذي انتسب إليه بنو إسرائيل."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"مولده معجزة، من عجوز عقيم وشيخ كبير، دليل على قدرة الله. وعاش حتى رأى حفدته، وكان مستجاب الدعوة، مباركاً، يدعو لأبنائه، فاستجاب الله دعاءه. وكان قبره في الخليل مع أبيه إبراهيم، في المغارة التي اشتراها إبراهيم، وهي اليوم الحرم الإبراهيمي."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الله يهب لمن يشاء على كبر، ولا ييأس من روح الله إلا القوم الكافرون. وأن البركة في الذرية الصالحة، وأن دعاء الوالد لولده مستجاب، وأن إسحاق كان حلقة الوصل بين إبراهيم ويعقوب، وسلسلة النبوة المباركة."}],lessons:["لا ييأس من روح الله إلا القوم الكافرون","الذرية الصالحة بركة مستمرة","دعاء الوالدين مفتاح البركة"],dua:"رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ",ayah:"وَبَشَّرْنَاهُ بِإِسْحَاقَ نَبِيًّا مِّنَ الصَّالِحِينَ"},{id:10,name:"يعقوب",title:"إسرائيل",period:"الشام - أبو الأسباط",icon:"⭐",gradient:"from-[#0f2a2a] to-[#2a6a5a]",accent:"#4a9a8a",story:[{title:"البداية",icon:"✨",text:"يعقوب بن إسحاق بن إبراهيم، هو إسرائيل، ومعنى إسرائيل عبد الله، وإليه ينتسب بنو إسرائيل الاثنا عشر سبطاً. ولد ومعه أخوه العيص توأم، وكان يعقوب أحب إلى أمه. هاجر إلى خاله لابان في حران، وتزوج بنتيه ليا وراحيل، وولد له اثنا عشر ولداً هم الأسباط، منهم يوسف وبنيامين من راحيل."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDE22",text:"ابتلي يعقوب بفقد أحب أبنائه يوسف، ثم أخيه بنيامين، فابيضت عيناه من الحزن فهو كظيم، لكنه لم ييأس، وكان يقول: إنما أشكو بثي وحزني إلى الله، وأعلم من الله ما لا تعلمون. وصبر صبراً جميلاً عشرات السنين، حتى فقد بصره حزناً على يوسف، وهو نبي يعلم أن يوسف حي."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"رد الله بصر يعقوب بقميص يوسف، لما ألقاه على وجهه فارتد بصيراً. وجمع الله شمله بيوسف في مصر بعد فراق دام أربعين سنة، وسجد له أبناؤه الأحد عشر، فكانت رؤيا يوسف قد تحققت. ومات يعقوب في مصر، وأوصى بنيه: ما تعبدون من بعدي؟ قالوا نعبد إلهك وإله آبائك إبراهيم وإسماعيل وإسحاق إلهاً واحداً."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الصبر الجميل بلا شكوى إلا لله، وأن الفرج يأتي بعد الشدة، وأن الرؤيا الصالحة جزء من النبوة، وأن الأبوة والبنوة لا تمنع الابتلاء، وأن العائلة الكبيرة نعمة إذا كانت على الإيمان."}],lessons:["الشكوى لله لا تنافي الصبر - إنما أشكو بثي لله","الصبر الجميل مفتاح الفرج","الرؤيا الصالحة بشارة للمؤمن"],dua:"إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ",ayah:"وَوَصَّىٰ بِهَا إِبْرَاهِيمُ بَنِيهِ وَيَعْقُوبُ"},{id:11,name:"يوسف",title:"الصديق",period:"مصر - عزيز مصر",icon:"\uD83D\uDC51",gradient:"from-[#1a1a2a] via-[#4a3a1a] to-[#D4AF37]",accent:"#D4AF37",story:[{title:"البداية",icon:"✨",text:"رأى يوسف وهو غلام: إني رأيت أحد عشر كوكباً والشمس والقمر رأيتهم لي ساجدين. فقال له أبوه يعقوب: لا تقصص رؤياك على إخوتك فيكيدوا لك كيداً. وكان يوسف أحب إلى أبيه من إخوته، فحسدوه، واتفقوا أن يلقوه في غيابة الجب، وجاؤوا أباهم عشاء يبكون: إنا ذهبنا نستبق وتركنا يوسف عند متاعنا فأكله الذئب."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDD17",text:"التقطت السيارة يوسف وباعوه في مصر بثمن بخس، فاشتراه عزيز مصر. وكبر يوسف وكان جميلاً، فراودته امرأة العزيز عن نفسه، فاستعصم وقال معاذ الله. فكادت له وسجنته ظلماً بضع سنين. وفي السجن فسر حلمين لصاحبيه، وفسر حلم الملك سبع بقرات سمان يأكلهن سبع عجاف وسبع سنبلات خضر وأخر يابسات، فجعله الملك على خزائن الأرض."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"معجزة يوسف في تعبير الرؤى، وعفته رغم الجمال والسلطان، وحكمته في إدارة أزمة المجاعة سبع سنين، فأنقذ مصر والشام من الهلاك. ثم جاء إخوته يطلبون الميرة، فعرفهم وهم له منكرون، ثم جمع أبويه وإخوته وقال: يا أبت هذا تأويل رؤياي من قبل قد جعلها ربي حقاً. ورفع أبويه على العرش وخروا له سجداً."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"سورة يوسف أحسن القصص، فيها أن الحسد يفرق، وأن العفة تنجي، وأن السجن قد يكون طريق الملك، وأن تأويل الرؤى علم، وأن العفو عند المقدرة شيمة الكرام، قال يوسف لإخوته: لا تثريب عليكم اليوم يغفر الله لكم. وأن الله لا يضيع أجر المحسنين."}],lessons:["العفة تنجي من المهالك وترفع للملك","لا تثريب - العفو عند المقدرة من شيم الأنبياء","إن الله لا يضيع أجر المحسنين"],dua:"رَبِّ قَدْ آتَيْتَنِي مِنَ الْمُلْكِ وَعَلَّمْتَنِي مِن تَأْوِيلِ الْأَحَادِيثِ",ayah:"لَّقَدْ كَانَ فِي يُوسُفَ وَإِخْوَتِهِ آيَاتٌ لِّلسَّائِلِينَ"},{id:12,name:"شعيب",title:"خطيب الأنبياء",period:"مدين - أصحاب الأيكة",icon:"⚖️",gradient:"from-[#2a3a1a] to-[#6a8a3a]",accent:"#8aaa5a",story:[{title:"البداية",icon:"✨",text:"أرسل الله شعيباً إلى أهل مدين، وكانوا قوماً يبخسون المكيال والميزان، ويقطعون الطريق، ويعبدون الأيكة، وهي شجرة ملتفة. وكان شعيب خطيب الأنبياء لفصاحته وبلاغته، يدعو قومه: يا قوم اعبدوا الله ما لكم من إله غيره، ولا تنقصوا المكيال والميزان إني أراكم بخير وإني أخاف عليكم عذاب يوم محيط."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDCCF",text:"قال قوم مدين: يا شعيب أصلاتك تأمرك أن نترك ما يعبد آباؤنا أو أن نفعل في أموالنا ما نشاء؟ إنك لأنت الحليم الرشيد! سخروا منه وهددوه: ولولا رهطك لرجمناك وما أنت علينا بعزيز. فصبر شعيب وقال: يا قوم اعملوا على مكانتكم إني عامل سوف تعلمون من يأتيه عذاب يخزيه."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"أصاب أهل مدين حر شديد، فخرجوا يطلبون الظل، فأظلتهم سحابة، فاجتمعوا تحتها، فأمطرت عليهم ناراً، فأحرقتهم، وجاءتهم الصيحة والرجفة فأصبحوا في ديارهم جاثمين. ونجى الله شعيباً والذين آمنوا معه برحمة منه. وكان قبره في وادي شعيب بالأردن."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الغش في الميزان يهلك الأمم، والاقتصاد بلا أخلاق خراب. وأن خطيب الأنبياء علمنا أن الدين معاملة، وأن الصلاة تأمر بترك الغش والفساد. وأن الظلة قد تكون عذاباً."}],lessons:["الدين معاملة - لا تبخسوا المكيال والميزان","الاقتصاد بلا أخلاق هلاك","الفصاحة في الدعوة سلاح الأنبياء"],dua:"وَسِعَ رَبُّنَا كُلَّ شَيْءٍ عِلْمًا عَلَى اللَّهِ تَوَكَّلْنَا",ayah:"وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْبًا"},{id:13,name:"أيوب",title:"الصابر",period:"الشام - حوران",icon:"\uD83E\uDD32",gradient:"from-[#1a2a2a] to-[#3a5a5a]",accent:"#5a8a8a",story:[{title:"البداية",icon:"✨",text:"كان أيوب عليه السلام رجلاً غنياً، أنعم الله عليه بالمال الكثير والولد الكثير والزروع والمواشي، وكان شاكراً عابداً، يذكر الله قائماً وقاعداً. فابتلاه الله، فأخذ ماله وولده، ثم ابتلاه في جسده، فأصابه مرض شديد، حتى نفر منه الناس إلا زوجته الصالحة، وبقي صابراً ثماني عشرة سنة، لم يجزع ولم يشك إلا إلى الله."},{title:"الدعوة والابتلاء",icon:"\uD83E\uDE79",text:"طال البلاء بأيوب، حتى قال الناس: ما ابتلي أيوب بهذا إلا بذنب عظيم. وكانت زوجته تعمل عند الناس لتطعمه. وفي يوم قالت له: ادع الله أن يشفيك، فقال: كم لبثنا في الرخاء؟ قالت: ثمانين سنة، قال: فإني أستحي أن أدعو ربي وما لبثت في البلاء إلا قليلاً. ثم دعا: أني مسني الضر وأنت أرحم الراحمين."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"أوحى الله إلى أيوب: اركض برجلك هذا مغتسل بارد وشراب. فضرب الأرض برجله، فنبعت عين ماء بارد، فاغتسل منها فبرأ ظاهره، وشرب فبرأ باطنه، ورد الله عليه ماله وولده ومثلهم معهم، وآتاه الله أهله ومثلهم معهم رحمة من عنده وذكرى للعابدين. وكانت زوجته قد ذهبت، فرجعت فلم تعرفه من جماله وكثرة ماله."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"أيوب مثل الصبر، يضرب به المثل، وعلمنا أن البلاء يرفع الدرجات، وأن الشكوى لله لا تنافي الصبر، وأن الفرج مع الكرب، وأن الله أرحم الراحمين، يبتلي ليعطي، ويمنع ليعطي، وما عند الله خير وأبقى."}],lessons:["الصبر على البلاء يرفع الدرجات ويرد النعم مضاعفة","أني مسني الضر وأنت أرحم الراحمين - أدب الدعاء","لا ييأس من رحمة الله إلا الضالون"],dua:"أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ",ayah:"إِنَّا وَجَدْنَاهُ صَابِرًا نِّعْمَ الْعَبْدُ إِنَّهُ أَوَّابٌ"},{id:14,name:"ذو الكفل",title:"الصابر الكافل",period:"الشام",icon:"\uD83D\uDEE1️",gradient:"from-[#2a1a1a] to-[#5a3a3a]",accent:"#8a6a6a",story:[{title:"البداية",icon:"✨",text:"ذو الكفل نبي كريم، قيل هو ابن أيوب، وقيل هو بشر بن أيوب، سمي ذا الكفل لأنه تكفل لقومه أن يكفيهم أمرهم ويقضي بينهم بالعدل ويصوم النهار ويقوم الليل ولا يغضب. فوفى بعهده، فسمي ذا الكفل، أي صاحب الكفالة والضمان، وكان صالحاً صادقاً."},{title:"الدعوة والابتلاء",icon:"⚖️",text:"تكفل ذو الكفل بنبي قبله، وقيل تكفل لقومه بالعدل والصبر. وكان لا يغضب أبداً، فأراد الشيطان أن يغضبه، فأرسل له رجلاً يأتيه وقت القيلولة ليزعجه، فكان يطرق بابه ويشكو، وذو الكفل صابر لا يغضب، حتى استطاع أن يوفي بكفالته، فكان مثالاً للوفاء بالعهد والصبر على الأذى."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"معجزته في وفائه وصبره، وأن الله ذكره مع إسماعيل وإدريس في عداد الصابرين، فقال: وإسماعيل وإدريس وذا الكفل كل من الصابرين. فكان صبره معجزة، ووفاؤه معجزة، ودخل في رحمة الله مع الصالحين."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الوفاء بالعهد خلق الأنبياء، ومن تكفل بخير وفى به، وأن كظم الغيظ منزلة عالية، وأن الله يدخل الصابرين في رحمته. وذو الكفل يعلمنا أن تحمل مسؤولية الناس شرف لا يناله إلا الصابرون."}],lessons:["الوفاء بالعهد من شيم الأنبياء","كظم الغيظ والصبر على الأذى عبادة","تحمل مسؤولية الناس شرف"],dua:"اللهم اجعلني من الصابرين الأوفياء بعهدهم",ayah:"وَإِسْمَاعِيلَ وَإِدْرِيسَ وَذَا الْكِفْلِ كُلٌّ مِّنَ الصَّابِرِينَ"},{id:15,name:"موسى",title:"كليم الله",period:"مصر - سيناء",icon:"\uD83C\uDF0A",gradient:"from-[#0a2a3a] via-[#1a5a7a] to-[#2a9a9a]",accent:"#2a9a9a",story:[{title:"البداية",icon:"✨",text:"ولد موسى في عام كان فرعون يقتل فيه أبناء بني إسرائيل، فأوحى الله إلى أمه أن أرضعيه فإذا خفت عليه فألقيه في اليم ولا تخافي ولا تحزني إنا رادوه إليك وجاعلوه من المرسلين. فألقته في تابوت في النيل، فالتقطه آل فرعون، ورباه فرعون في قصره، وكانت امرأة فرعون آسية تحبه وتقول: قرة عين لي ولك لا تقتلوه."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDC0D",text:"كبر موسى ووكز رجلاً فقتله خطأ، فخرج إلى مدين، وتزوج ابنة شعيب، ورعى الغنم عشر سنين. ثم عاد، وكلمه الله عند جبل الطور: يا موسى إني أنا الله لا إله إلا أنا فاعبدني. وأيده بتسع آيات: العصا تنقلب حية، واليد تخرج بيضاء، والطوفان والجراد والقمل والضفادع والدم والسنين ونقص الثمرات. فدعا فرعون فطغى وقال أنا ربكم الأعلى."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"أمر الله موسى أن يضرب البحر بعصاه، فانفلق فكان كل فرق كالطود العظيم، طريق يابس، فعبر موسى وقومه، وتبعهم فرعون وجنوده، فلما توسطوا البحر انطبق عليهم فغرقوا. وقال فرعون: آمنت أنه لا إله إلا الذي آمنت به بنو إسرائيل، فقيل: آلآن وقد عصيت قبل! ونجى الله بني إسرائيل، وأنزل على موسى التوراة في الألواح."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"موسى أكثر الأنبياء ذكراً في القرآن، وقصته كلها عبر، من إلقائه في اليم إلى كلام الله له، إلى شق البحر، إلى التيه أربعين سنة. يعلمنا أن الله يحفظ من يشاء ولو في بيت عدوه، وأن العصا بيد الله حية، وأن البحر بيد الله طريق، وأن فرعون مهما علا فمصيره الغرق."}],lessons:["الله يحفظ أولياءه ولو في قصر فرعون","العصا بيد الله معجزة والبحر طريق","لا تخف إنك أنت الأعلى - اليقين ينصر"],dua:"رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي",ayah:"وَكَلَّمَ اللَّهُ مُوسَىٰ تَكْلِيمًا"},{id:16,name:"هارون",title:"وزير موسى",period:"مصر - سيناء",icon:"\uD83D\uDDE3️",gradient:"from-[#2a2a3a] to-[#5a5a7a]",accent:"#8a8aaa",story:[{title:"البداية",icon:"✨",text:"هارون أخو موسى، أكبر منه سناً، وكان فصيحاً بليغاً، محبباً إلى قومه، لين الجانب. دعا موسى ربه: واجعل لي وزيراً من أهلي هارون أخي اشدد به أزري وأشركه في أمري. فاستجاب الله له، وجعل هارون نبياً وزيراً لموسى، يعينه على الدعوة والبلاغ، وكان هارون أفصح لساناً من موسى."},{title:"الدعوة والابتلاء",icon:"\uD83E\uDD1D",text:"ذهب موسى وهارون إلى فرعون، فقالا: إنا رسولا ربك فأرسل معنا بني إسرائيل ولا تعذبهم. فطغى فرعون. وكان هارون مع موسى في كل المواقف، حتى لما ذهب موسى لميقات ربه أربعين ليلة، استخلف هارون على قومه، فجاء السامري وصنع لهم عجلاً جسداً له خوار، فعبدوه، فنهاهم هارون فلم ينتهوا، وكادوا يقتلونه، فصبر حتى رجع موسى."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"كانت فصاحة هارون معجزة، وحبه في قلوب بني إسرائيل، وكانوا يحبونه أكثر من موسى لشدة لينه، بينما كان موسى شديداً. ومات هارون قبل موسى في التيه، في جبل هور، فحزن عليه موسى وبنو إسرائيل حزناً شديداً، ودفن هناك."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الأخوة في الله تعين على الدعوة، والفصاحة نعمة، واللين يجذب القلوب، وأن الوزير الصالح يشد أزر أخيه، وأن الفتنة قد تقع في غياب القائد، وأن الصبر على قومك حتى يرجع الحق خير من الفرقة."}],lessons:["الأخ الصالح وزير وسند في الدعوة","الفصاحة واللين تجذب القلوب","الصبر على الفتنة حتى يعود القائد"],dua:"رَبِّ اغْفِرْ لِي وَلِأَخِي وَأَدْخِلْنَا فِي رَحْمَتِكَ",ayah:"وَوَهَبْنَا لَهُ مِن رَّحْمَتِنَا أَخَاهُ هَارُونَ نَبِيًّا"},{id:17,name:"داود",title:"خليفة الله في الأرض",period:"القدس - 1000 ق.م",icon:"\uD83C\uDFB5",gradient:"from-[#1a2a1a] via-[#3a5a2a] to-[#8a9a3a]",accent:"#8a9a5a",story:[{title:"البداية",icon:"✨",text:"كان داود شاباً صغيراً في جيش طالوت، وكان جالوت الجبار يبارز، فقال داود: أنا أقاتله، وكان معه مقلاع وحجر، فرمى جالوت بحجر فقتله، فآتاه الله الملك والحكمة وعلمه مما يشاء. وكان داود حسن الصوت، إذا سبح تسبح معه الجبال والطير، وكان يقرأ الزبور بصوت يذهل الطير والوحش."},{title:"الدعوة والابتلاء",icon:"⚔️",text:"أصبح داود ملكاً نبياً، يحكم بين الناس بالعدل، وكان يصوم يوماً ويفطر يوماً، ويقوم نصف الليل، أحب الصيام إلى الله وأحب القيام. وكان يصنع الدروع، ألان الله له الحديد، يعملها سابغات ويقدر في السرد. وابتلي بقضية الخصمين إذ تسورا المحراب، فحكم ثم استغفر ربه وخر راكعاً وأناب."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"سخر الله لداود الجبال يسبحن معه والطير، وألان له الحديد، وآتاه الزبور كتاباً فيه مواعظ وحكم. وكان صوته إذا قرأ الزبور تقف الطير في السماء، وتسبح الجبال، حتى كان الناس والجن يجتمعون لسماعه. وكان ملكه واسعاً، وحكمه عادلاً، وقضاؤه فصلاً."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"من مقلاع إلى ملك، الله يرفع من يشاء، وحسن الصوت نعمة، والعمل باليد شرف للأنبياء، وأن الملك مع العدل عبادة، وأن الاستغفار بعد الخطأ شيمة الصالحين، وأن التسبيح مع الجبال يورث القرب."}],lessons:["العمل باليد شرف - ألان الله له الحديد","حسن الصوت نعمة تسبح لها الجبال","العدل أساس الملك والاستغفار يرفع الخطأ"],dua:"رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا",ayah:"وَلَقَدْ آتَيْنَا دَاوُودَ مِنَّا فَضْلًا يَا جِبَالُ أَوِّبِي مَعَهُ"},{id:18,name:"سليمان",title:"ملك الملوك",period:"القدس - مملكة عظيمة",icon:"\uD83E\uDD85",gradient:"from-[#0f1a2a] via-[#2a4a6a] to-[#D4AF37]",accent:"#D4AF37",story:[{title:"البداية",icon:"✨",text:"ورث سليمان داود، وكان شاباً ذكياً، آتاه الله الحكمة صغيراً، وكان يقضي مع أبيه، ففهمه الله القضية. سأل الله ملكاً لا ينبغي لأحد من بعده، فقال: رب اغفر لي وهب لي ملكاً لا ينبغي لأحد من بعدي إنك أنت الوهاب. فاستجاب الله له، وسخر له الريح تجري بأمره، والشياطين كل بناء وغواص، والطير والجن والإنس."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDC1C",text:"كان سليمان يسمع كلام النمل، فتبسم ضاحكاً من قول نملة: يا أيها النمل ادخلوا مساكنكم لا يحطمنكم سليمان وجنوده وهم لا يشعرون. وكان يفهم لغة الطير، ويتفقد الطير فقال ما لي لا أرى الهدهد؟ فجاءه الهدهد بخبر بلقيس ملكة سبأ التي تعبد الشمس من دون الله، فأرسل إليها كتاباً: ألا تعلوا علي وأتوني مسلمين."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"جاءت بلقيس وأسلمت مع سليمان لله رب العالمين، ورأى عرشها مستقراً عنده قبل أن يرتد إليها طرفها، وكان الذي عنده علم من الكتاب آصف بن برخيا. وكان سليمان يبني بالجن القصور والمحاريب والجفان كالجواب والقدور الراسيات، وكانت الريح تحمله غدوها شهر ورواحها شهر. ومات متكئاً على عصاه، فما دلهم على موته إلا دابة الأرض تأكل منسأته."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الملك إذا كان مع الشكر نعمة، وسليمان رغم ملكه كان شاكراً أواباً، يعلمنا أن الدنيا لا تغني عن الآخرة، وأن العلم بالطير والنمل آية، وأن ملك سليمان زال وبقي ذكره بالشكر والعدل. وأن الجن لا يعلمون الغيب، ولو علموا ما لبثوا في العذاب المهين."}],lessons:["الشكر يحفظ الملك - رب أوزعني أن أشكر نعمتك","العلم بلغة الطير والنمل من آيات الله","الدنيا مهما عظمت زائلة"],dua:"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ",ayah:"وَوَرِثَ سُلَيْمَانُ دَاوُودَ وَقَالَ يَا أَيُّهَا النَّاسُ عُلِّمْنَا مَنطِقَ الطَّيْرِ"},{id:19,name:"إلياس",title:"نبي بني إسرائيل",period:"بعلبك - الشام",icon:"\uD83D\uDD25",gradient:"from-[#1a1a1a] to-[#4a3a2a]",accent:"#aa7a4a",story:[{title:"البداية",icon:"✨",text:"إلياس نبي من أنبياء بني إسرائيل، أرسله الله إلى قوم يعبدون صنماً يقال له بعل، في مدينة بعلبك بالشام، وكانوا يعبدونه من دون الله، فدعاهم إلياس إلى التوحيد، وقال: أتدعون بعلاً وتذرون أحسن الخالقين؟ الله ربكم ورب آبائكم الأولين. وكان قومه ملوكاً جبابرة يعبدون الأصنام."},{title:"الدعوة والابتلاء",icon:"\uD83C\uDF27️",text:"كذب قوم إلياس نبيهم، وهموا بقتله، فدعا الله أن يمسك عنهم المطر، فأمسك الله عنهم المطر ثلاث سنين حتى هلكت مواشيهم وزروعهم، فجاؤوا إليه يسألونه أن يدعو لهم، فدعا فجاء المطر، ثم عادوا إلى كفرهم، فدعا عليهم فهلكوا، ونجى الله إلياس."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"كانت معجزة إلياس في حبس المطر وإطلاقه بدعائه، وأنه كان يرزق رغم انقطاع المطر، وأن الله رفعه إليه. وقيل هو إدريس نفسه، وقيل هو إلياس الذي يظهر مع الخضر، والعلم عند الله، لكنه ذكر في القرآن من المرسلين المكرمين."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"عبادة بعل لا تزال رمزاً للشرك، واسم بعلبك شاهد، وأن الدعاء يحبس المطر ويطلقه، وأن الأنبياء قد يهاجرون من قومهم إذا كذبوا، وأن الله يذكر عباده المخلصين في الآخرين، سلام على إلياسين."}],lessons:["التوحيد أحسن الخالقين لا صنم بعل","الدعاء يمسك المطر ويطلقه","الصبر على تكذيب القوم"],dua:"اللهم اجعلني من المخلصين",ayah:"وَإِنَّ إِلْيَاسَ لَمِنَ الْمُرْسَلِينَ"},{id:20,name:"اليسع",title:"خليفة إلياس",period:"الشام",icon:"\uD83C\uDF3F",gradient:"from-[#1a2a1a] to-[#4a6a3a]",accent:"#6a9a5a",story:[{title:"البداية",icon:"✨",text:"اليسع نبي كريم، خليفة إلياس في بني إسرائيل، كان مستوراً مخفياً، يدعو إلى الله بعد إلياس، وكان من الصالحين الأخيار، ذكره الله في القرآن مع إسماعيل وإدريس وذا الكفل في عداد الصابرين، ومع إبراهيم وإسحاق ويعقوب في عداد الأخيار المصطفين."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDD6F️",text:"قام اليسع بدعوة بني إسرائيل بعد إلياس، وكانوا قد فسدوا، فدعاهم إلى التوبة والرجوع إلى شريعة التوراة، وصبر على أذاهم، وكان يدعوهم بالحكمة والموعظة الحسنة، ويذكرهم بأيام الله، ويحذرهم من عذاب الله إن لم يتوبوا."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"بارك الله في دعوة اليسع، وكان مستجاب الدعوة، يشفي المرضى بدعائه، ويكثر القليل، وكانت له كرامات، وكان قومه يرون فيه بركة إلياس، فاتبعوه، وكان من المرسلين الأخيار الذين اصطفاهم الله."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"اليسع يعلمنا أن خلافة الأنبياء مسؤولية، وأن الصبر على الدعوة بعد نبي قبلك جهاد، وأن الله يصطفي من يشاء من الأخيار، وأن الذكر الحسن باق، وأن النبوة اصطفاء لا اكتساب."}],lessons:["خلافة الدعوة مسؤولية وصبر","الاصطفاء من الله للأخيار","الذكر الحسن باق بعد الرحيل"],dua:"اللهم اجعلني من الأخيار المصطفين",ayah:"وَاذْكُرْ إِسْمَاعِيلَ وَالْيَسَعَ وَذَا الْكِفْلِ وَكُلٌّ مِّنَ الْأَخْيَارِ"},{id:21,name:"يونس",title:"ذو النون",period:"نينوى - العراق",icon:"\uD83D\uDC0B",gradient:"from-[#0a2a3a] to-[#1a6a8a]",accent:"#2a8aaa",story:[{title:"البداية",icon:"✨",text:"يونس بن متى، أرسله الله إلى أهل نينوى في العراق، وكانوا مائة ألف أو يزيدون، يعبدون الأصنام، فدعاهم إلى التوحيد فكذبوه، فغضب منهم وخرج من بينهم مغاضباً، ولم يأذن له ربه بالخروج، فركب سفينة، فهاج البحر، فاقترعوا من يلقى في البحر، فوقع القرعة على يونس، فألقى بنفسه في البحر."},{title:"الدعوة والابتلاء",icon:"\uD83C\uDF0A",text:"التقمه الحوت، فأصبح في ظلمات ثلاث: ظلمة الليل وظلمة البحر وظلمة بطن الحوت. فنادى في الظلمات: لا إله إلا أنت سبحانك إني كنت من الظالمين. فسمعت الملائكة تسبيحه، وقالت: صوت معروف من مكان غريب! فاستجاب الله له ونجاه. أما قومه فلما رأوا العذاب آمنوا، فكشف الله عنهم العذاب ومتعهم إلى حين، وهم القوم الوحيدون الذين آمنوا بعد رؤية العذاب فنفعهم إيمانهم."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"لبث يونس في بطن الحوت، وقيل ثلاثة أيام، وقيل سبع، وقيل أربعين، والله أعلم. وأنبت الله عليه شجرة من يقطين، وهي الدباء، تظله وتطعم ثمرها بلا شوك، وتطرد الذباب، حتى قوي ورجع إلى قومه فوجدهم مؤمنين، فمكث فيهم يعلمهم. وكانت معجزته في نجاة قومه كلهم، مائة ألف أو يزيدون."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"لا يجوز للنبي أن يغضب ويترك قومه بلا إذن، وأن التسبيح في الظلمات ينجي، وأن لا إله إلا أنت سبحانك إني كنت من الظالمين دعاء الكرب لا يرد، وأن قوم يونس مثال أن الإيمان عند رؤية العذاب قد ينفع إذا كان صادقاً، وأن اليقطين شفاء."}],lessons:["التسبيح في الظلمات ينجي - لا إله إلا أنت سبحانك","لا تترك الدعوة غضباً بلا إذن من الله","الإيمان الصادق يكشف العذاب"],dua:"لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",ayah:"وَذَا النُّونِ إِذ ذَّهَبَ مُغَاضِبًا"},{id:22,name:"زكريا",title:"كافل مريم",period:"القدس",icon:"\uD83D\uDD4A️",gradient:"from-[#1a1a2a] to-[#4a4a6a]",accent:"#7a7aaa",story:[{title:"البداية",icon:"✨",text:"زكريا نبي كريم من أنبياء بني إسرائيل، كان نجاراً، وكان زوج خالة مريم، وكافل مريم عليها السلام، يأتيها بالطعام في المحراب فيجد عندها رزقاً: يا مريم أنى لك هذا؟ قالت هو من عند الله إن الله يرزق من يشاء بغير حساب. وكان زكريا شيخاً كبيراً قد وهن العظم منه واشتعل الرأس شيباً، وامرأته عاقر، لا تلد."},{title:"الدعوة والابتلاء",icon:"\uD83E\uDD32",text:"دعا زكريا ربه دعاء خفياً: رب إني وهن العظم مني واشتعل الرأس شيباً ولم أكن بدعائك رب شقياً، وإني خفت الموالي من ورائي وكانت امرأتي عاقراً فهب لي من لدنك ولياً يرثني ويرث من آل يعقوب واجعله رب رضياً. فنادته الملائكة وهو قائم يصلي في المحراب: أن الله يبشرك بيحيى مصدقاً بكلمة من الله وسيداً وحصوراً ونبياً من الصالحين."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"ولد يحيى لزكريا على كبر، معجزة كمولد إسحاق، وكانت آية زكريا ألا يكلم الناس ثلاث ليال سوياً إلا رمزاً، فخرج على قومه من المحراب فأوحى إليهم أن سبحوا بكرة وعشياً. وكان يحيى سيداً وحصوراً لا يأتي النساء زهداً، ونبياً من الصالحين."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الدعاء الخفي مستجاب، والله يهب على الكبر، والكفالة شرف، وزكريا علمنا أن النجارة مهنة الأنبياء، وأن من يرزق مريم في المحراب قادر أن يرزق الشيخ الكبير ولداً نبياً، وأن المحراب مكان البشارات."}],lessons:["الدعاء الخفي في المحراب مستجاب","الله يهب على الكبر ولا يعجزه شيء","كفالة الصالحين شرف وبركة"],dua:"رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ",ayah:"يَا زَكَرِيَّا إِنَّا نُبَشِّرُكَ بِغُلَامٍ اسْمُهُ يَحْيَىٰ"},{id:23,name:"يحيى",title:"السيد الحصور",period:"القدس",icon:"\uD83C\uDF3E",gradient:"from-[#1a2a1a] to-[#5a6a3a]",accent:"#8a9a6a",story:[{title:"البداية",icon:"✨",text:"يحيى بن زكريا، ولد معجزة لأبوين كبيرين، وآتاه الله الحكم صبياً، قال تعالى: يا يحيى خذ الكتاب بقوة وآتيناه الحكم صبياً. كان سيداً في قومه، وحصوراً لا يتزوج، تقياً، باراً بوالديه، لم يكن جباراً عصياً، وكان يبكي من خشية الله كثيراً حتى أثر البكاء في خديه."},{title:"الدعوة والابتلاء",icon:"⚖️",text:"دعا يحيى بني إسرائيل إلى التوبة والطاعة، وكان يدعو إلى خمس كلمات أمره الله بها: أن يعبدوا الله ولا يشركوا به شيئاً، وأن يصلوا، وأن يصوموا، وأن يتصدقوا، وأن يذكروا الله. وكان شجاعاً في الحق، فنهى ملك بني إسرائيل عن الزواج من ابنة أخيه، وكانت لا تحل له، فحقدت عليه المرأة وطلبت رأسه."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"قتل يحيى شهيداً، قطع رأسه وقدم في طست لبغي من بغايا بني إسرائيل، فكان سيد الشهداء، وقيل قتل معه زكريا أبوه، فكانا شهيدين. وغضب الله لمقتلهما، وسلط عليهم بختنصر، فقتل منهم سبعين ألفاً. وكان يحيى مصدقاً بكلمة من الله، مصدقاً بعيسى، فهو أول من آمن بعيسى."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"الحق يحتاج شجاعة، وقد يقتل النبي إذا قال الحق، وأن البغي قد تطلب رأس نبي، وأن الله ينتقم لأوليائه، وأن الصبا قد يؤتى الحكم، وأن الحصور زاهد في الدنيا، وأن البكاء من خشية الله عبادة يحيى."}],lessons:["قول الحق قد يكلف الرأس لكنه يرفع المقام","الحكم يؤتى صبياً إذا أخلص","البكاء من خشية الله سمة الأنبياء"],dua:"اللهم اجعلني تقياً باراً غير جبار عصي",ayah:"وَسَلَامٌ عَلَيْهِ يَوْمَ وُلِدَ وَيَوْمَ يَمُوتُ وَيَوْمَ يُبْعَثُ حَيًّا"},{id:24,name:"عيسى",title:"المسيح كلمة الله",period:"بيت لحم - القدس",icon:"✨",gradient:"from-[#0a2a3a] via-[#2a6a7a] to-[#7ac0c0]",accent:"#7ac0c0",story:[{title:"البداية",icon:"✨",text:"عيسى بن مريم، كلمة الله ألقاها إلى مريم وروح منه، ولد من غير أب، معجزة باهرة، حملت به مريم فانتبذت به مكاناً قصياً، فأجاءها المخاض إلى جذع النخلة، فقيل لها هزي إليك بجذع النخلة تساقط عليك رطباً جنياً. فلما جاءت به قومها تحمله قالوا: يا مريم لقد جئت شيئاً فرياً. فأشارت إليه، فقال عيسى وهو في المهد: إني عبد الله آتاني الكتاب وجعلني نبياً."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDD4A️",text:"دعا عيسى بني إسرائيل إلى عبادة الله، وأيده الله بمعجزات: يبرئ الأكمه والأبرص ويحيي الموتى بإذن الله، وينبئهم بما يأكلون وما يدخرون في بيوتهم، ويصنع من الطين كهيئة الطير فينفخ فيه فيكون طيراً بإذن الله، وأنزل عليهم المائدة من السماء. فآمن به الحواريون، وكفر به بنو إسرائيل وهموا بقتله."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"رفع الله عيسى إليه، وما قتلوه وما صلبوه ولكن شبه لهم، بل رفعه الله إليه، وسينزل في آخر الزمان حكماً عدلاً، يكسر الصليب ويقتل الخنزير ويضع الجزية، ويحكم بشريعة محمد ﷺ. وأمه مريم صديقة، اصطفاها الله على نساء العالمين، وطهرها، وجعل ابنها آية للعالمين."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"عيسى عبد الله ورسوله، وليس إلهاً ولا ابن إله، بل كلمة الله وروح منه، خلقه كما خلق آدم من تراب ثم قال له كن فيكون. ومعجزاته بإذن الله لا من عنده، وأمه مريم مثال الطهر، والحواريون أنصار الله، والرفع إلى السماء دليل قدرة الله."}],lessons:["عيسى عبد الله ورسوله وكلمته - التوحيد الخالص","المعجزات بإذن الله لا بذات النبي","مريم اصطفاها الله على نساء العالمين"],dua:"رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ",ayah:"إِذْ قَالَ اللَّهُ يَا عِيسَى ابْنَ مَرْيَمَ اذْكُرْ نِعْمَتِي عَلَيْكَ"},{id:25,name:"محمد ﷺ",title:"خاتم النبيين",period:"مكة - المدينة - 570-632م",icon:"\uD83D\uDC9A",gradient:"from-[#0F2C2C] via-[#1a4a2a] to-[#D4AF37]",accent:"#D4AF37",story:[{title:"البداية",icon:"✨",text:"محمد بن عبد الله بن عبد المطلب، ولد يتيماً في مكة عام الفيل، أرضعته حليمة السعدية، وماتت أمه آمنة وهو ابن ست، وكفله جده عبد المطلب ثم عمه أبو طالب. كان صادقاً أميناً، لا يعبد صنماً، يتحنث في غار حراء، حتى جاءه جبريل وهو ابن أربعين، وقال: اقرأ باسم ربك الذي خلق، خلق الإنسان من علق، اقرأ وربك الأكرم. فكان خاتم النبيين وسيد المرسلين."},{title:"الدعوة والابتلاء",icon:"\uD83D\uDD4B",text:"دعا محمد ﷺ قومه سراً ثلاث سنين، ثم جهر: يا معشر قريش قولوا لا إله إلا الله تفلحوا. فكذبوه وآذوه، وألقوا على ظهره سلا الجزور وهو ساجد، وخنقوه، وحاصروه في شعب أبي طالب ثلاث سنين حتى أكلوا ورق الشجر، وماتت خديجة وعمه أبو طالب في عام الحزن، ثم أخرجوه من مكة مهاجراً، فهاجر إلى المدينة، وأقام دولة الإسلام، وجاهد في سبيل الله حتى أتاه اليقين."},{title:"المعجزة",icon:"\uD83C\uDF1F",text:"معجزته الكبرى القرآن، كتاب لا يأتيه الباطل من بين يديه ولا من خلفه، تحدى به العرب أن يأتوا بسورة من مثله فعجزوا، وهو باق إلى يوم القيامة. وانشق له القمر، ونبع الماء من بين أصابعه، وكلمه الحجر والشجر، وحن إليه الجذع، وأسرى به من المسجد الحرام إلى المسجد الأقصى ثم عرج به إلى السماوات العلى، ورأى من آيات ربه الكبرى، وفرضت عليه الصلوات الخمس."},{title:"العبرة والدروس",icon:"\uD83D\uDCDC",text:"محمد ﷺ خاتم النبيين، لا نبي بعده، ورسالته خاتمة الرسالات، ودينه خاتم الأديان، وشريعته ناسخة لكل الشرائع، وهو رحمة للعالمين، أرسله الله كافة للناس بشيراً ونذيراً. من أطاعه دخل الجنة، ومن عصاه فقد أبى. وسنته باقية، وسيرته قدوة، ومحبته إيمان، والصلاة عليه قربة، وشفاعته حق، وحوضه مورود، ومقامه محمود، صلى الله عليه وسلم تسليماً كثيراً."}],lessons:["وما أرسلناك إلا رحمة للعالمين - الرحمة أساس الرسالة","القرآن معجزة باقية إلى قيام الساعة","الصبر على الأذى ثم النصر - وعد الله حق"],dua:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ",ayah:"مَّا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ"}];function hi(){let[e,n]=D.useState(null),[t,r]=D.useState(""),[l,o]=D.useState(18),[u,i]=D.useState(!1),[s,f]=D.useState(()=>{try{return JSON.parse(localStorage.getItem("qasas_favs")||"[]")}catch{return[]}}),[p,h]=D.useState(()=>{try{return JSON.parse(localStorage.getItem("qasas_read")||"[]")}catch{return[]}}),[m,S]=D.useState(()=>localStorage.getItem("qasas_offline")==="1"),[k,_]=D.useState(typeof navigator<"u"?navigator.onLine:!0),[B,c]=D.useState(!1),[a,d]=D.use
